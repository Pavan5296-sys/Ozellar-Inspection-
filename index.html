    doc.setDrawColor(PDF_COLOR.border[0],PDF_COLOR.border[1],PDF_COLOR.border[2]);
    doc.setLineWidth(0.25);
    doc.roundedRect(cx, cy, w, h, 1.5, 1.5, 'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(15);
    doc.setTextColor(c.color[0],c.color[1],c.color[2]);
    doc.text(String(c.value), cx+w/2, cy+11, {align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.setTextColor(PDF_COLOR.grey[0],PDF_COLOR.grey[1],PDF_COLOR.grey[2]);
    doc.text(c.label, cx+w/2, cy+17, {align:'center'});
  });
  var rows = Math.ceil(cards.length/cols);
  return y + rows*(h+gap) + 4;
}
/* Adds a thin frame near the physical edge of every page (including the
   cover), plus a footer rule with vessel name / page number on every page
   except the cover. Done as a final pass over every page once all content
   is drawn, since the total page count isn't known until the report is
   finished. */
function pdfAddFooters(doc, insp){
  var total = doc.internal.getNumberOfPages();
  for(var i=1;i<=total;i++){
    doc.setPage(i);
    doc.setDrawColor(PDF_COLOR.border[0],PDF_COLOR.border[1],PDF_COLOR.border[2]);
    doc.setLineWidth(0.4);
    doc.rect(6, 6, PDF_PAGE_W-12, PDF_PAGE_H-12);
    if(i===1) continue;
    doc.setLineWidth(0.2);
    doc.line(PDF_MARGIN, PDF_PAGE_H-12, PDF_PAGE_W-PDF_MARGIN, PDF_PAGE_H-12);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.setTextColor(PDF_COLOR.faint[0],PDF_COLOR.faint[1],PDF_COLOR.faint[2]);
    doc.text(insp.vesselName||'Inspection report', PDF_MARGIN, PDF_PAGE_H-7);
    doc.text('Page '+(i-1)+' of '+(total-1), PDF_PAGE_W-PDF_MARGIN, PDF_PAGE_H-7, {align:'right'});
  }
}

/* Shared between the jsPDF builder and the HTML report builder below, so
   the two output formats can never drift apart on which fields they show
   or how they're labeled. Vessel particulars come from the matched fleet
   record (vessel, possibly null for an old or one-off manually-typed
   vessel) — only fields that actually have a value are listed, since most
   vessels won't have all twenty-plus particulars filled in and a wall of
   "-" rows would be worse than just omitting them. Inspection particulars
   always come from the inspection record itself. */
function inspectionTypeLabel(t){
  if(t==='remote') return 'Remote';
  if(t==='sailing') return 'Sailing';
  return 'Port';
}
function buildVesselParticularsRows(insp, vessel){
  var rows = [
    ['Vessel name', insp.vesselName||'-'],
    ['IMO number', insp.imo||'-'],
    ['Vessel type', insp.vesselType||'-']
  ];
  if(vessel){
    VESSEL_EXTRA_FIELDS.forEach(function(f){
      if(vessel[f.key]) rows.push([f.label, vessel[f.key]]);
    });
  }
  return rows;
}
function buildInspectionParticularsRows(insp){
  var rows = [
    ['Inspection type', inspectionTypeLabel(insp.inspectionType)],
    ['Port of inspection', insp.port||'-'],
    ['Inspection start date', fmtDate(insp.date)||'-'],
    ['Inspection completion date', fmtDate(insp.completionDate)||'-']
  ];
  if(insp.inspectionType==='sailing'){
    rows.push(['Sailing period \u2013 from', (fmtDate(insp.sailFromDate)||'-') + (insp.sailFromPort ? ' \u00b7 '+insp.sailFromPort : '')]);
    rows.push(['Sailing period \u2013 to', (fmtDate(insp.sailToDate)||'-') + (insp.sailToPort ? ' \u00b7 '+insp.sailToPort : '')]);
  } else if(insp.inspectionType==='remote'){
    rows.push(['Remote period \u2013 from', fmtDate(insp.remoteFromDate)||'-']);
    rows.push(['Remote period \u2013 to', fmtDate(insp.remoteToDate)||'-']);
  }
  rows.push(['Inspector', insp.inspector||'-']);
  rows.push(['Company / rank', insp.company||'-']);
  rows.push(['Status', insp.status==='completed'?'Completed':'In progress']);
  return rows;
}
function buildInspectionPDF(insp, responses, extrasList, customSectionsList, vessel){
  var sections = inspectionSections(insp);
  var sectionsTotal = inspectionTotal(sections);
  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor({unit:'mm', format:'a4'});
  logDiagnostic('pdf_generationStarted', {
    inspectionId: insp && insp.id,
    canvasSupported: (function(){ try{ return !!document.createElement('canvas').getContext('2d'); }catch(e){ return false; } })(),
    docAddImageIsFunction: typeof doc.addImage==='function'
  });
  var respMap = {};
  responses.forEach(function(r){ respMap[r.sectionSr+'_'+r.qIdx] = r; });
  var extrasMap = {};
  (extrasList||[]).forEach(function(ex){ extrasMap[ex.sectionSr] = ex; });

  /* Question and observation cards get a border drawn around them, but
     their height depends on wrapped text and photo rows that aren't known
     until they're actually drawn. Rather than fragile pre-measurement,
     each card's vertical extent is recorded here as it's drawn (in its
     final page's coordinates), and every border is stamped in one pass
     at the very end, once no more pages will be added. A card that
     happens to split across a page break is simply left unbordered
     rather than drawing something visually broken. */
  var cardBorders = [];
  function pdfDrawCardBorders(doc){
    var current = doc.internal.getNumberOfPages();
    cardBorders.forEach(function(b){
      doc.setPage(b.page);
      doc.setDrawColor(PDF_COLOR.border[0],PDF_COLOR.border[1],PDF_COLOR.border[2]);
      doc.setLineWidth(0.3);
      doc.roundedRect(PDF_MARGIN, b.top, PDF_CONTENT_W, b.bottom-b.top, 2, 2, 'D');
    });
    doc.setPage(current);
  }

  var photoUrlCache = {}; // avoid converting the same blob twice
  function photoDataUrls(photos){
    photos = photos || [];
    return Promise.all(photos.map(function(p){
      if(photoUrlCache[p.id]) return photoUrlCache[p.id];
      var pr = blobToDataURL(p.blob).then(function(raw){ return pdfSafeImageDataUrl(raw); }).catch(function(e){
        logDiagnostic('pdf_photoDataUrlThrew', {photoId: p.id, assetId: p.assetId, hasBlob: !!p.blob, errName: e && e.name, errMessage: e && e.message});
        // The local copy of this photo won't read on this device even
        // after retries — see the matching note in hydratePhotoDataUrls.
        // Fall back to a fresh copy from the cloud rather than dropping
        // the photo from the report.
        if(!p.assetId || !syncEnabled || !cloudDb) return null;
        return fetchAssetAsBlob(p.assetId).then(function(freshBlob){
          if(!freshBlob) return null;
          p.blob = freshBlob;
          return blobToDataURL(freshBlob).then(function(raw2){ return pdfSafeImageDataUrl(raw2); }).catch(function(){ return null; });
        });
      });
      photoUrlCache[p.id] = pr;
      return pr;
    })).then(function(urls){ return urls.filter(Boolean); });
  }

  var y = PDF_MARGIN;

  /* ---- Page 1: cover ---- */
  var coverChain = Promise.resolve();
  doc.setFillColor(PDF_COLOR.navy[0],PDF_COLOR.navy[1],PDF_COLOR.navy[2]);
  doc.rect(6, 6, PDF_PAGE_W-12, 36, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(19); doc.setTextColor(255,255,255);
  doc.text('OZELLAR ALL RIGHT INSPECTION', PDF_PAGE_W/2, 22, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(185,212,215);
  doc.text('VESSEL INSPECTION REPORT', PDF_PAGE_W/2, 31, {align:'center'});
  doc.setTextColor(PDF_COLOR.ink[0],PDF_COLOR.ink[1],PDF_COLOR.ink[2]);

  var coverPhotoBox = {x: PDF_PAGE_W/2 - 65, y: 55, w: 130, h: 80};
  doc.setFillColor(225,228,230);
  doc.roundedRect(coverPhotoBox.x+1.5, coverPhotoBox.y+1.5, coverPhotoBox.w, coverPhotoBox.h, 2, 2, 'F');
  doc.setFillColor(255,255,255);
  doc.setDrawColor(PDF_COLOR.border[0],PDF_COLOR.border[1],PDF_COLOR.border[2]); doc.setLineWidth(0.3);
  doc.roundedRect(coverPhotoBox.x, coverPhotoBox.y, coverPhotoBox.w, coverPhotoBox.h, 2, 2, 'FD');
  function coverPhotoPlaceholder(msg){
    doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(PDF_COLOR.faint[0],PDF_COLOR.faint[1],PDF_COLOR.faint[2]);
    doc.text(msg, PDF_PAGE_W/2, coverPhotoBox.y+coverPhotoBox.h/2, {align:'center'});
    doc.setTextColor(PDF_COLOR.ink[0],PDF_COLOR.ink[1],PDF_COLOR.ink[2]);
  }
  if(insp.vesselPhoto && insp.vesselPhoto.blob){
    coverChain = coverChain.then(function(){
      return blobToDataURL(insp.vesselPhoto.blob).catch(function(){
        // Local read failed even after retries — fall back to a fresh
        // copy from the cloud rather than showing "Photo unavailable"
        // when the photo demonstrably exists there. See the matching
        // note in hydratePhotoDataUrls for why this happens.
        if(!insp.vesselPhoto.assetId || !syncEnabled || !cloudDb) throw new Error('no local photo and no way to recover it');
        return fetchAssetAsBlob(insp.vesselPhoto.assetId).then(function(freshBlob){
          if(!freshBlob) throw new Error('cloud fetch also failed');
          insp.vesselPhoto.blob = freshBlob;
          return blobToDataURL(freshBlob);
        });
      });
    }).then(function(raw){ return pdfSafeImageDataUrl(raw); }).then(function(photo){
      if(!photo){ coverPhotoPlaceholder('Photo unavailable'); return; }
      function draw(size){
        var fit = pdfFitBox(size.w, size.h, coverPhotoBox.w-4, coverPhotoBox.h-4);
        var ix = coverPhotoBox.x + (coverPhotoBox.w-fit.w)/2;
        var iy = coverPhotoBox.y + (coverPhotoBox.h-fit.h)/2;
        try{ doc.addImage(photo.url, 'JPEG', ix, iy, fit.w, fit.h); }catch(e){
          logDiagnostic('pdf_coverAddImageThrew', {errName: e && e.name, errMessage: e && e.message, urlPrefix: (photo.url||'').slice(0,40), w: fit.w, h: fit.h});
        }
      }
      if(photo.w && photo.h){ draw({w:photo.w, h:photo.h}); return; }
      return pdfLoadImageSize(photo.url).then(function(size){ if(size) draw(size); });
    }).catch(function(e){
      logDiagnostic('pdf_coverChainThrew', {errName: e && e.name, errMessage: e && e.message});
      coverPhotoPlaceholder('Photo unavailable');
    });
  } else {
    coverPhotoPlaceholder('No vessel photo provided');
  }

  return coverChain.then(function(){
    var ty = coverPhotoBox.y + coverPhotoBox.h + 14;
    doc.setFont('helvetica','bold'); doc.setFontSize(17); doc.setTextColor(PDF_COLOR.navy[0],PDF_COLOR.navy[1],PDF_COLOR.navy[2]);
    doc.text(insp.vesselName || 'Unnamed vessel', PDF_PAGE_W/2, ty, {align:'center'});
    ty += 7;
    var subline = [insp.imo?('IMO '+insp.imo):null, insp.vesselType||null].filter(Boolean).join('   \u00b7   ');
    if(subline){
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(PDF_COLOR.grey[0],PDF_COLOR.grey[1],PDF_COLOR.grey[2]);
      doc.text(subline, PDF_PAGE_W/2, ty, {align:'center'});
    }
    ty += 14;

    var cardX = PDF_MARGIN+15, cardW = PDF_CONTENT_W-30, rowH = 9.5;
    var coverRows = [
      ['Date of inspection', fmtDate(insp.date)||'-'],
      ['Port of inspection', insp.port||'-'],
      ['Inspector', insp.inspector||'-'],
      ['Status', insp.status==='completed'?'Completed':'In progress']
    ];
    doc.setDrawColor(PDF_COLOR.border[0],PDF_COLOR.border[1],PDF_COLOR.border[2]); doc.setLineWidth(0.25);
    doc.roundedRect(cardX, ty, cardW, rowH*coverRows.length, 2, 2, 'D');
    coverRows.forEach(function(r, i){
      var ry = ty + i*rowH;
      if(i>0) doc.line(cardX, ry, cardX+cardW, ry);
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(PDF_COLOR.grey[0],PDF_COLOR.grey[1],PDF_COLOR.grey[2]);
      doc.text(r[0], cardX+5, ry+6.3);
      doc.setFont('helvetica','normal'); doc.setTextColor(PDF_COLOR.ink[0],PDF_COLOR.ink[1],PDF_COLOR.ink[2]);
      doc.text(String(r[1]), cardX+cardW-5, ry+6.3, {align:'right'});
    });

    /* ---- Page 2: summary ---- */
    doc.addPage(); y = PDF_MARGIN;
    y = pdfHeading(doc, 'Summary', y);
    var sumStats = {ok:0,bad:0,na:0};
    responses.forEach(function(r){
      if(r.applicable===false) sumStats.na++;
      else if(r.applicable===true && r.answer==='yes') sumStats.ok++;
      else if(r.applicable===true && r.answer==='no') sumStats.bad++;
    });
    var sumPending = sectionsTotal - (sumStats.ok+sumStats.bad+sumStats.na);
    y = pdfStatCards(doc, [
      {value:sectionsTotal, label:'Total questions', color:PDF_COLOR.navy},
      {value:sumStats.ok, label:'Satisfactory', color:PDF_COLOR.good},
      {value:sumStats.bad, label:'Observations', color:PDF_COLOR.bad},
      {value:sumStats.na, label:'Not applicable', color:PDF_COLOR.na},
      {value:sumPending, label:'Pending', color:PDF_COLOR.pending}
    ], y+2);
    y += 4;
    y = pdfBodyText(doc, insp.summary || 'No summary entered.', PDF_MARGIN, y, PDF_CONTENT_W, 11);

    /* ---- Page 3: vessel & inspection particulars ---- */
    doc.addPage(); y = PDF_MARGIN;
    y = pdfHeading(doc, 'Vessel particulars', y);
    y = pdfCompactRows(doc, buildVesselParticularsRows(insp, vessel), y);
    y += 4;
    y = pdfHeading(doc, 'Inspection particulars', y);
    y = pdfCompactRows(doc, buildInspectionParticularsRows(insp), y);

    /* ---- Inspection done report ---- */
    doc.addPage(); y = PDF_MARGIN;
    y = pdfHeading(doc, 'Inspection done report', y);

    var chain = Promise.resolve();
    var cardPad = 4;
    function renderQuestionBlock(ref, qtext, rec){
      chain = chain.then(function(){
        var tag = 'Pending', color = PDF_COLOR.pending;
        if(rec.applicable===false){ tag='N/A'; color=PDF_COLOR.na; }
        else if(rec.applicable===true && rec.answer==='yes'){ tag='Satisfactory'; color=PDF_COLOR.good; }
        else if(rec.applicable===true && rec.answer==='no'){ tag='Observation'; color=PDF_COLOR.bad; }
        var innerX = PDF_MARGIN + cardPad, innerW = PDF_CONTENT_W - cardPad*2;
        y = pdfEnsureSpace(doc, y, 20);
        var cardTop = y - cardPad, startPage = doc.internal.getNumberOfPages();
        doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(PDF_COLOR.teal[0],PDF_COLOR.teal[1],PDF_COLOR.teal[2]);
        doc.text(ref, innerX, y);
        pdfStatusTagRight(doc, tag, PDF_MARGIN+PDF_CONTENT_W-cardPad, y, color);
        y += 5.5;
        y = pdfBodyText(doc, qtext, innerX, y, innerW, 10);
        if(rec.remarks){
          doc.setFont('helvetica','italic');
          y = pdfBodyText(doc, '"'+rec.remarks+'"', innerX, y+0.5, innerW, 9.5);
        }
        y = pdfActionCallout(doc, [
          {label:'Corrective action:', text:rec.correctiveAction},
          {label:'Preventive action:', text:rec.preventiveAction}
        ], innerX, y+1, innerW);
        function finishCard(){
          if(doc.internal.getNumberOfPages()===startPage) cardBorders.push({page:startPage, top:cardTop, bottom:y});
          y += 6;
        }
        if(rec.photos && rec.photos.length){
          return photoDataUrls(rec.photos).then(function(urls){
            return pdfAddPhotoRow(doc, urls, innerX, y+1, innerW, 45).then(function(newY){ y = newY + cardPad; finishCard(); });
          });
        }
        y += cardPad;
        finishCard();
      });
    }
    function renderGeneralPhotos(extras){
      if(!extras || !extras.photos || !extras.photos.length) return;
      chain = chain.then(function(){
        y = pdfEnsureSpace(doc, y, 55); // label + first photo row kept together
        doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(PDF_COLOR.teal[0],PDF_COLOR.teal[1],PDF_COLOR.teal[2]);
        doc.text('General section photos', PDF_MARGIN, y);
        y += 6;
        return photoDataUrls(extras.photos).then(function(urls){
          return pdfAddPhotoRow(doc, urls, PDF_MARGIN, y, PDF_CONTENT_W, 45).then(function(newY){ y = newY + 6; });
        });
      });
    }
    function renderCustomFindings(extras){
      (extras && extras.customFindings || []).forEach(function(cf){
        renderQuestionBlock('Extra', cf.text||'(no description entered)', {applicable:true, answer:cf.answer, remarks:'', correctiveAction:cf.correctiveAction||'', preventiveAction:cf.preventiveAction||'', photos:cf.photos});
      });
    }

    sections.forEach(function(section){
      var extras = extrasMap[section.sr];
      var hasAny = (extras && ((extras.photos&&extras.photos.length) || (extras.customFindings&&extras.customFindings.length)));
      section.q.forEach(function(pair){ if(respMap[section.sr+'_'+pair[2]]) hasAny = true; });
      if(!hasAny) return;
      chain = chain.then(function(){
        y = pdfSectionBand(doc, String(sectionDisplayNumber(section, sections)).padStart(2,'0')+'.  '+section.name, y);
      });
      renderGeneralPhotos(extras);
      section.q.forEach(function(pair){
        var rec = respMap[section.sr+'_'+pair[2]];
        if(rec) renderQuestionBlock(pair[0], pair[1], rec);
      });
      renderCustomFindings(extras);
    });
    (customSectionsList||[]).forEach(function(cs){
      var extras = extrasMap[cs.id];
      var hasAny = extras && ((extras.photos&&extras.photos.length) || (extras.customFindings&&extras.customFindings.length));
      if(!hasAny) return;
      chain = chain.then(function(){
        y = pdfSectionBand(doc, cs.name+'  (custom section)', y);
      });
      renderGeneralPhotos(extras);
      renderCustomFindings(extras);
    });

    /* ---- Observation list ---- */
    chain = chain.then(function(){
      doc.addPage(); y = PDF_MARGIN;
      y = pdfHeading(doc, 'Observation list', y);
      var findings = collectDeficiencyFindings(responses, extrasList, customSectionsList, sections);
      if(!findings.length){
        doc.setFont('helvetica','italic'); doc.setFontSize(10.5); doc.setTextColor(140,140,140);
        y = pdfEnsureSpace(doc, y, 8);
        doc.text('No observations recorded.', PDF_MARGIN, y);
        y += 8;
        return;
      }
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(PDF_COLOR.grey[0],PDF_COLOR.grey[1],PDF_COLOR.grey[2]);
      doc.text(findings.length+(findings.length===1?' observation recorded':' observations recorded'), PDF_MARGIN, y);
      y += 8;
      var fchain = Promise.resolve();
      findings.forEach(function(f, idx){
        fchain = fchain.then(function(){
          var innerX = PDF_MARGIN + cardPad, innerW = PDF_CONTENT_W - cardPad*2;
          if(idx>0) y += 4;
          y = pdfEnsureSpace(doc, y, 20);
          var cardTop = y - cardPad, startPage = doc.internal.getNumberOfPages();
          doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(PDF_COLOR.bad[0],PDF_COLOR.bad[1],PDF_COLOR.bad[2]);
          doc.text(f.refLabel+' \u00b7 '+f.sectionName, innerX, y);
          y += 5.5;
          doc.setFont('helvetica','normal'); doc.setTextColor(PDF_COLOR.ink[0],PDF_COLOR.ink[1],PDF_COLOR.ink[2]);
          y = pdfBodyText(doc, f.qtext, innerX, y, innerW, 10);
          if(f.remarks){
            doc.setFont('helvetica','italic');
            y = pdfBodyText(doc, '"'+f.remarks+'"', innerX, y+0.5, innerW, 9.5);
          }
          y = pdfActionCallout(doc, [
            {label:'Corrective action:', text:f.correctiveAction},
            {label:'Preventive action:', text:f.preventiveAction}
          ], innerX, y+1, innerW);
          function finishCard(){
            if(doc.internal.getNumberOfPages()===startPage) cardBorders.push({page:startPage, top:cardTop, bottom:y});
            y += cardPad;
          }
          /* Photos are shown once already, against this same finding in the
             Inspection done report section above — repeating them here
             would just duplicate the same images. */
          y += cardPad;
          finishCard();
        });
      });
      return fchain;
    });

    /* ---- Conclusion ---- */
    chain = chain.then(function(){
      doc.addPage(); y = PDF_MARGIN;
      y = pdfHeading(doc, 'Conclusion', y);
      y = pdfBodyText(doc, insp.conclusion || 'No conclusion entered.', PDF_MARGIN, y, PDF_CONTENT_W, 11);
    });

    return chain.then(function(){
      pdfDrawCardBorders(doc);
      pdfAddFooters(doc, insp);
      return doc;
    });
  });
}

function showPdfGenerating(){
  var el = document.createElement('div');
  el.className = 'pdf-generating';
  el.id = 'pdfGeneratingOverlay';
  el.textContent = 'Generating report…';
  document.body.appendChild(el);
}
function hidePdfGenerating(){
  var el = document.getElementById('pdfGeneratingOverlay');
  if(el) el.remove();
}
/* Shows the actual report content immediately, using the same plain HTML +
   data: URL images that already render reliably everywhere else in this
   app — no PDF viewer, no iframe, nothing that has to run inside this
   artifact's own nested sandbox. A real PDF (with the JPEG-guarantee fix
   from buildInspectionPDF) is only generated on demand, when the person
   actually taps Download, since that's the one path already confirmed to
   work regardless of environment. */
function showReportPreviewAndDownload(inspectionId){
  return idbGet('inspections', inspectionId).then(function(insp){
    return ensureInspectionSections(insp);
  }).then(function(insp){
    return Promise.all([
      idbGetAllByIndex('responses','byInspection', inspectionId),
      idbGetAllByIndex('sectionExtras','byInspection', inspectionId),
      getCustomSections(inspectionId),
      findVesselByName(insp.vesselName)
    ]).then(function(results){
      var responses = results[0], extrasList = results[1], customSectionsList = results[2], vessel = results[3];
      showPdfGenerating();
      return buildPrintableReport(insp, responses, extrasList, customSectionsList, vessel).then(function(printHtml){
        hidePdfGenerating();
        showReportPreviewOverlay(printHtml, insp, responses, extrasList, customSectionsList, vessel);
      }).catch(function(err){
        hidePdfGenerating();
        toast('Could not build the report'+(err&&err.message?': '+err.message:''));
      });
    });
  });
}
function showReportPreviewOverlay(printHtml, insp, responses, extrasList, customSectionsList, vessel){
  var existing = document.getElementById('pdfPreviewOverlay');
  if(existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.className = 'pdf-preview-overlay';
  overlay.id = 'pdfPreviewOverlay';
  var downloadLabel = pdfAvailable() ? 'Download PDF' : 'Download';
  overlay.innerHTML = '' +
    '<div class="pdf-preview-header">'+
      '<h3>Inspection report</h3>'+
      '<div class="actions">'+
        '<button class="btn btn-accent btn-sm" id="btnReportDownload">'+ICONS.download+downloadLabel+'</button>'+
        '<button class="icon-btn" id="btnPdfClose" aria-label="Close">'+ICONS.x+'</button>'+
      '</div>'+
    '</div>'+
    '<div class="pdf-preview-body report-preview-scroll"><div class="print-only" style="display:block;">'+printHtml+'</div></div>';
  document.body.appendChild(overlay);
  document.getElementById('btnPdfClose').addEventListener('click', function(){ overlay.remove(); });
  document.getElementById('btnReportDownload').addEventListener('click', function(){
    if(pdfAvailable()){
      showPdfGenerating();
      buildInspectionPDF(insp, responses, extrasList, customSectionsList, vessel).then(function(doc){
        hidePdfGenerating();
        var blob = doc.output('blob');
        downloadBlob(blob, safeFileName(insp.vesselName)+'_'+insp.date+'_report.pdf', 'application/pdf').then(function(ok){
          if(ok) toast('Report saved');
        });
      }).catch(function(err){
        hidePdfGenerating();
        toast('Could not generate the PDF'+(err&&err.message?': '+err.message:''));
      });
    } else {
      var standaloneHtml = buildStandaloneReportHTML(printHtml, (insp.vesselName||'Vessel')+' inspection report');
      downloadBlob(standaloneHtml, safeFileName(insp.vesselName)+'_'+insp.date+'_report.html', 'text/html').then(function(ok){
        if(ok) toast('Report saved');
      });
    }
  });
}

function buildStandaloneReportHTML(printInnerHtml, title){
  var styleEl = document.querySelector('style');
  var css = styleEl ? styleEl.textContent : '';
  return '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<title>'+escapeHtml(title)+'</title><style>'+css+'</style></head>'+
    '<body><div id="app"><div class="print-only" style="display:block;">'+printInnerHtml+'</div></div></body></html>';
}

function buildPrintableReport(insp, responses, extrasList, customSectionsList, vessel){
  var sections = inspectionSections(insp);
  var respMap = {};
  responses.forEach(function(r){ respMap[r.sectionSr+'_'+r.qIdx] = r; });
  var extrasMap = {};
  (extrasList||[]).forEach(function(ex){ extrasMap[ex.sectionSr] = ex; });

  /* Every photo's blob is read into a data: URL via FileReader — cheap for
     one photo, but a full inspection can easily hold 50-150+ of them
     across 75 sections, and this used to fire every single
     FileReader.readAsDataURL() at once, the instant each pushPhotoImgs/
     pushSinglePhotoImg call ran while the HTML above was being built. A
     laptop shrugs off that many simultaneous reads; a phone — with a
     fraction of the memory, and this often being the 100th photo the
     browser has decoded in one sitting — can have some of those reads
     fail under the resulting resource pressure. Each failure already
     degraded gracefully to a "[photo unavailable]" placeholder rather
     than losing the whole report, which is exactly why this looked like
     "photos are missing" instead of an error: on a phone, under load,
     quite a few of them could fail this way at once. Recording the blobs
     as jobs here and reading them through a small, fixed-size pool below
     — instead of starting every FileReader the moment each photo's <img>
     tag is written — keeps the number of decodes in flight at any moment
     the same on a phone as on a laptop, so nothing ever gets to pile up. */
  var photoJobs = [];
  function pushPhotoImgs(photos){
    var out = '';
    (photos||[]).forEach(function(p){
      var idx = photoJobs.length;
      photoJobs.push({idx:idx, blob:p.blob, assetId:p.assetId});
      out += '<img data-photo-slot="'+idx+'">';
    });
    return out;
  }
  function pushSinglePhotoImg(photo, cssClass){
    var idx = photoJobs.length;
    photoJobs.push({idx:idx, blob:photo.blob, assetId:photo.assetId});
    return '<img class="'+(cssClass||'')+'" data-photo-slot="'+idx+'">';
  }

  function generalPhotosRowHtml(extras){
    if(!extras || !extras.photos || !extras.photos.length) return '';
    return '' +
      '<div class="pr-q">'+
        '<span class="pref">General</span> Section photos '+
        '<div class="pr-photos">'+pushPhotoImgs(extras.photos)+'</div>'+
      '</div>';
  }
  function customFindingsRowsHtml(extras){
    var out = '';
    (extras && extras.customFindings || []).forEach(function(cf){
      var tag = 'Pending', tagStyle = 'background:#eee;color:#555;';
      if(cf.answer==='yes'){ tag='Satisfactory'; tagStyle='background:#E7F5EC;color:#1F8A57;'; }
      else if(cf.answer==='no'){ tag='Observation'; tagStyle='background:#FBEAE6;color:#C1432A;'; }
      var photosHtml = pushPhotoImgs(cf.photos);
      out += '' +
        '<div class="pr-q">'+
          '<span class="pref">Extra</span> '+escapeHtml(cf.text||'(no description entered)')+' '+
          '<span class="stat-tag" style="'+tagStyle+'">'+tag+'</span>'+
          (cf.correctiveAction ? '<div class="pr-rem"><strong>Corrective action:</strong> '+escapeHtml(cf.correctiveAction)+'</div>' : '')+
          (cf.preventiveAction ? '<div class="pr-rem"><strong>Preventive action:</strong> '+escapeHtml(cf.preventiveAction)+'</div>' : '')+
          (photosHtml ? '<div class="pr-photos">'+photosHtml+'</div>' : '')+
        '</div>';
    });
    return out;
  }

  /* ---- Page 1: cover ---- */
  var coverPhotoHtml = (insp.vesselPhoto && insp.vesselPhoto.blob)
    ? '<div class="pr-cover-photo">'+pushSinglePhotoImg(insp.vesselPhoto)+'</div>'
    : '<div class="pr-cover-photo pr-cover-photo-empty">No vessel photo provided</div>';
  var coverHtml = '' +
    '<div class="pr-page pr-cover">'+
      '<h1 class="pr-cover-title">OZELLAR ALL RIGHT INSPECTION</h1>'+
      coverPhotoHtml+
      '<table class="pr-cover-meta">'+
        '<tr><td class="k">Date of inspection</td><td>'+escapeHtml(fmtDate(insp.date)||'-')+'</td></tr>'+
        '<tr><td class="k">Port of inspection</td><td>'+escapeHtml(insp.port||'-')+'</td></tr>'+
        '<tr><td class="k">Vessel name</td><td>'+escapeHtml(insp.vesselName||'-')+'</td></tr>'+
        '<tr><td class="k">IMO number</td><td>'+escapeHtml(insp.imo||'-')+'</td></tr>'+
      '</table>'+
    '</div>';

  /* ---- Page 2: summary (free write-up) ---- */
  var summaryHtml = '' +
    '<div class="pr-page">'+
      '<h2 class="pr-page-title">Summary</h2>'+
      '<div class="pr-freetext">'+(insp.summary ? escapeHtml(insp.summary) : '<span class="pr-empty-note">No summary entered.</span>')+'</div>'+
    '</div>';

  /* ---- Page 3: vessel & inspection particulars ---- */
  function pairedMetaTableHtml(rows){
    var out = '';
    for(var i=0; i<rows.length; i+=3){
      var a = rows[i], b = rows[i+1], c = rows[i+2];
      out += '<tr><td class="k">'+a[0]+'</td><td>'+escapeHtml(a[1])+'</td>'+
        (b ? ('<td class="k">'+b[0]+'</td><td>'+escapeHtml(b[1])+'</td>') : '<td></td><td></td>')+
        (c ? ('<td class="k">'+c[0]+'</td><td>'+escapeHtml(c[1])+'</td>') : '<td></td><td></td>')+
        '</tr>';
    }
    return '<table class="pr-meta-table">'+out+'</table>';
  }
  var vesselDetailHtml = '' +
    '<div class="pr-page">'+
      '<h2 class="pr-page-title">Vessel particulars</h2>'+
      pairedMetaTableHtml(buildVesselParticularsRows(insp, vessel))+
    '</div>'+
    '<div class="pr-page">'+
      '<h2 class="pr-page-title">Inspection particulars</h2>'+
      pairedMetaTableHtml(buildInspectionParticularsRows(insp))+
    '</div>';

  /* ---- Page 4+: inspection done report (flat, no zone grouping) ---- */
  var sectionsHtml = '';
  sections.forEach(function(section){
    var rowsHtml = '';
    var anyRow = false;
    var extras = extrasMap[section.sr];

    var generalRow = generalPhotosRowHtml(extras);
    if(generalRow){ anyRow = true; rowsHtml += generalRow; }

    section.q.forEach(function(pair){
      var ref = pair[0], qtext = pair[1];
      var rec = respMap[section.sr+'_'+pair[2]];
      if(!rec) return;
      anyRow = true;
      var tag = 'Pending', tagStyle = 'background:#eee;color:#555;';
      if(rec.applicable===false){ tag='N/A'; tagStyle='background:#EEF1F2;color:#8592A0;'; }
      else if(rec.applicable===true && rec.answer==='yes'){ tag='Satisfactory'; tagStyle='background:#E7F5EC;color:#1F8A57;'; }
      else if(rec.applicable===true && rec.answer==='no'){ tag='Observation'; tagStyle='background:#FBEAE6;color:#C1432A;'; }
      var photosHtml = pushPhotoImgs(rec.photos);
      rowsHtml += '' +
        '<div class="pr-q">'+
          '<span class="pref">'+escapeHtml(ref)+'</span> '+escapeHtml(qtext)+' '+
          '<span class="stat-tag" style="'+tagStyle+'">'+tag+'</span>'+
          (rec.remarks ? '<div class="pr-rem">'+escapeHtml(rec.remarks)+'</div>' : '')+
          (rec.correctiveAction ? '<div class="pr-rem"><strong>Corrective action:</strong> '+escapeHtml(rec.correctiveAction)+'</div>' : '')+
          (rec.preventiveAction ? '<div class="pr-rem"><strong>Preventive action:</strong> '+escapeHtml(rec.preventiveAction)+'</div>' : '')+
          (photosHtml ? '<div class="pr-photos">'+photosHtml+'</div>' : '')+
        '</div>';
    });

    var cfRows = customFindingsRowsHtml(extras);
    if(cfRows){ anyRow = true; rowsHtml += cfRows; }

    if(anyRow){
      sectionsHtml += '<div class="pr-sec-h">'+escapeHtml(String(sectionDisplayNumber(section, sections)).padStart(2,'0'))+'. '+escapeHtml(section.name)+'</div>'+rowsHtml;
    }
  });
  (customSectionsList||[]).forEach(function(cs){
    var extras = extrasMap[cs.id];
    var rowsHtml = generalPhotosRowHtml(extras) + customFindingsRowsHtml(extras);
    var anyRow = !!(extras && ((extras.photos && extras.photos.length) || (extras.customFindings && extras.customFindings.length)));
    if(anyRow){
      sectionsHtml += '<div class="pr-sec-h">'+escapeHtml(cs.name)+' (custom section)</div>'+rowsHtml;
    }
  });
  var inspectionReportHtml = '' +
    '<div class="pr-page">'+
      '<h2 class="pr-page-title">Inspection done report</h2>'+
      (sectionsHtml || '<p class="pr-empty-note">No sections answered yet.</p>')+
    '</div>';

  /* ---- Observation list (deficiencies) — no photos here: they're already
     shown against each finding in the Inspection done report section above,
     so repeating them here would just duplicate the same images. ---- */
  var findings = collectDeficiencyFindings(responses, extrasList, customSectionsList, sections);
  var findingsHtml = findings.length ? findings.map(function(f){
    return '' +
      '<div class="pr-q">'+
        '<span class="pref">'+escapeHtml(f.refLabel)+'</span> '+escapeHtml(f.sectionName)+': '+escapeHtml(f.qtext)+' '+
        '<span class="stat-tag" style="background:#FBEAE6;color:#C1432A;">Observation</span>'+
        (f.remarks ? '<div class="pr-rem">'+escapeHtml(f.remarks)+'</div>' : '')+
        (f.correctiveAction ? '<div class="pr-rem"><strong>Corrective action:</strong> '+escapeHtml(f.correctiveAction)+'</div>' : '')+
        (f.preventiveAction ? '<div class="pr-rem"><strong>Preventive action:</strong> '+escapeHtml(f.preventiveAction)+'</div>' : '')+
      '</div>';
  }).join('') : '<p class="pr-empty-note">No observations recorded.</p>';
  var observationListHtml = '' +
    '<div class="pr-page">'+
      '<h2 class="pr-page-title">Observation list</h2>'+
      findingsHtml+
    '</div>';

  /* ---- Last page: conclusion (free write-up) ---- */
  var conclusionHtml = '' +
    '<div class="pr-page pr-last">'+
      '<h2 class="pr-page-title">Conclusion</h2>'+
      '<div class="pr-freetext">'+(insp.conclusion ? escapeHtml(insp.conclusion) : '<span class="pr-empty-note">No conclusion entered.</span>')+'</div>'+
    '</div>';

  var html = coverHtml + summaryHtml + vesselDetailHtml + inspectionReportHtml + observationListHtml + conclusionHtml;

  var PHOTO_READ_CONCURRENCY = 4; // keeps memory pressure flat regardless of device or photo count
  function readPhotoJobs(jobs){
    var results = new Array(jobs.length);
    var next = 0;
    function worker(){
      if(next >= jobs.length) return Promise.resolve();
      var job = jobs[next++];
      return blobToDataURL(job.blob).then(function(url){
        results[job.idx] = {idx: job.idx, url: url};
      }).catch(function(){
        // Local read failed even after retries — fall back to a fresh
        // copy from the cloud rather than showing this photo as
        // unavailable. See the matching note in hydratePhotoDataUrls.
        if(!job.assetId || !syncEnabled || !cloudDb){ results[job.idx] = {idx: job.idx, url: null}; return; }
        return fetchAssetAsBlob(job.assetId).then(function(freshBlob){
          if(!freshBlob){ results[job.idx] = {idx: job.idx, url: null}; return; }
          return blobToDataURL(freshBlob).then(function(url){
            results[job.idx] = {idx: job.idx, url: url};
          }).catch(function(){ results[job.idx] = {idx: job.idx, url: null}; });
        });
      }).then(worker);
    }
    var workers = [];
    for(var i=0;i<Math.min(PHOTO_READ_CONCURRENCY, jobs.length);i++){ workers.push(worker()); }
    return Promise.all(workers).then(function(){ return results; });
  }

  return readPhotoJobs(photoJobs).then(function(results){
    var container = document.createElement('div');
    container.innerHTML = html;
    results.forEach(function(res){
      var img = container.querySelector('[data-photo-slot="'+res.idx+'"]');
      if(!img) return;
      img.removeAttribute('data-photo-slot');
      if(res.url){
        img.src = res.url;
      } else {
        // Photo could not be read (corrupted or unreadable) - degrade
        // gracefully rather than losing the whole report.
        img.replaceWith(document.createTextNode('[photo unavailable]'));
      }
    });
    return container.innerHTML;
  });
}

function safeFileName(s){ return String(s||'inspection').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,''); }

function exportInspectionJSON(inspId){
  var insp;
  return idbGet('inspections', inspId).then(function(i){
    return ensureInspectionSections(i);
  }).then(function(i){
    insp = i;
    return Promise.all([
      idbGetAllByIndex('responses','byInspection', inspId),
      idbGetAllByIndex('sectionExtras','byInspection', inspId),
      getCustomSections(inspId)
    ]);
  }).then(function(results){
    var responses = results[0], extrasList = results[1], customSectionsList = results[2];
    var inspOut = Object.assign({}, insp);
    var respOut = [];
    var chain = Promise.resolve();

    if(insp.vesselPhoto && insp.vesselPhoto.blob){
      chain = chain.then(function(){
        return blobToDataURL(insp.vesselPhoto.blob).then(function(data){
          inspOut.vesselPhoto = {id: insp.vesselPhoto.id, data: data};
        }).catch(function(){ inspOut.vesselPhoto = null; });
      });
    } else {
      inspOut.vesselPhoto = null;
    }

    responses.forEach(function(r){
      chain = chain.then(function(){
        var photoChain = Promise.resolve([]);
        if(r.photos && r.photos.length){
          photoChain = Promise.all(r.photos.map(function(p){
            return blobToDataURL(p.blob).then(function(data){ return {id:p.id, data:data}; }).catch(function(){ return null; });
          })).then(function(list){ return list.filter(Boolean); });
        }
        return photoChain.then(function(photos){
          respOut.push({
            sectionSr:r.sectionSr, qIdx:r.qIdx, ref:r.ref,
            applicable:r.applicable, answer:r.answer, remarks:r.remarks||'',
            correctiveAction:r.correctiveAction||'', preventiveAction:r.preventiveAction||'', photos:photos
          });
        });
      });
    });
    var extrasOut = [];
    extrasList.forEach(function(ex){
      chain = chain.then(function(){
        var genPhotoChain = Promise.all((ex.photos||[]).map(function(p){
          return blobToDataURL(p.blob).then(function(data){ return {id:p.id, data:data}; }).catch(function(){ return null; });
        })).then(function(list){ return list.filter(Boolean); });
        var cfChain = Promise.all((ex.customFindings||[]).map(function(cf){
          return Promise.all((cf.photos||[]).map(function(p){
            return blobToDataURL(p.blob).then(function(data){ return {id:p.id, data:data}; }).catch(function(){ return null; });
          })).then(function(cfPhotos){
            return {id:cf.id, text:cf.text||'', answer:cf.answer||null, correctiveAction:cf.correctiveAction||'', preventiveAction:cf.preventiveAction||'', photos:cfPhotos.filter(Boolean)};
          });
        }));
        return Promise.all([genPhotoChain, cfChain]).then(function(r){
          extrasOut.push({sectionSr: ex.sectionSr, photos: r[0], customFindings: r[1]});
        });
      });
    });
    var customSectionsOut = customSectionsList.map(function(cs){
      return {id:cs.id, name:cs.name};
    });
    return chain.then(function(){
      var payload = {app:'VIR', version:4, exportedAt: Date.now(), inspection: inspOut, responses: respOut, sectionExtras: extrasOut, customSections: customSectionsOut};
      return downloadBlob(JSON.stringify(payload), safeFileName(insp.vesselName)+'_'+insp.date+'_backup.json', 'application/json');
    }).then(function(ok){
      if(ok) toast('Backup exported');
    });
  });
}

function importInspectionJSON(file){
  return file.text().then(function(text){
    var payload = JSON.parse(text);
    if(!payload || payload.app!=='VIR' || !payload.inspection) throw new Error('Invalid backup file');
    var insp = Object.assign({}, payload.inspection);
    insp.id = uid();
    insp.updatedAt = Date.now();
    var vesselPhotoPromise = Promise.resolve();
    if(insp.vesselPhoto && insp.vesselPhoto.data){
      var photoId = insp.vesselPhoto.id;
      vesselPhotoPromise = Promise.resolve().then(function(){
        insp.vesselPhoto = {id: photoId||uid(), blob: dataURLToBlob(insp.vesselPhoto.data)};
      });
    } else {
      insp.vesselPhoto = null;
    }
    return vesselPhotoPromise.then(function(){ return idbPut('inspections', insp); }).then(function(){
      var list = payload.responses||[];
      var chain = Promise.resolve();
      list.forEach(function(r){
        chain = chain.then(function(){
          var photoChain = Promise.resolve([]);
          if(r.photos && r.photos.length){
            photoChain = Promise.all(r.photos.map(function(p){
              return Promise.resolve({id: p.id||uid(), blob: dataURLToBlob(p.data)});
            }));
          }
          return photoChain.then(function(photos){
            var rec = {
              key: responseKey(insp.id, r.sectionSr, r.qIdx),
              inspectionId: insp.id, sectionSr:r.sectionSr, qIdx:r.qIdx, ref:r.ref,
              applicable:r.applicable, answer:r.answer, remarks:r.remarks||'',
              correctiveAction:r.correctiveAction||'', preventiveAction:r.preventiveAction||'', photos:photos, updatedAt: Date.now()
            };
            return idbPut('responses', rec);
          });
        });
      });
      var customSectionsList = payload.customSections||[];
      customSectionsList.forEach(function(cs){
        chain = chain.then(function(){
          var rec = {id: cs.id, inspectionId: insp.id, name: cs.name, createdAt: Date.now(), updatedAt: Date.now()};
          return idbPut('customSections', rec);
        });
      });
      var extrasList = payload.sectionExtras||[];
      extrasList.forEach(function(ex){
        chain = chain.then(function(){
          var genPhotoChain = Promise.all((ex.photos||[]).map(function(p){
            return Promise.resolve({id:p.id||uid(), blob:dataURLToBlob(p.data)});
          }));
          var cfChain = Promise.all((ex.customFindings||[]).map(function(cf){
            return Promise.all((cf.photos||[]).map(function(p){
              return Promise.resolve({id:p.id||uid(), blob:dataURLToBlob(p.data)});
            })).then(function(cfPhotos){
              return {id: cf.id||uid(), text: cf.text||'', answer: cf.answer||null, correctiveAction: cf.correctiveAction||'', preventiveAction: cf.preventiveAction||'', photos: cfPhotos};
            });
          }));
          return Promise.all([genPhotoChain, cfChain]).then(function(r){
            var rec = {
              key: extrasKey(insp.id, ex.sectionSr), inspectionId: insp.id, sectionSr: ex.sectionSr,
              photos: r[0], customFindings: r[1], updatedAt: Date.now()
            };
            return idbPut('sectionExtras', rec);
          });
        });
      });
      return chain.then(function(){ return insp; });
    });
  });
}

function exportInspectionCSV(inspId){
  var insp;
  return idbGet('inspections', inspId).then(function(i){
    return ensureInspectionSections(i);
  }).then(function(i){
    insp = i;
    return Promise.all([
      idbGetAllByIndex('responses','byInspection', inspId),
      idbGetAllByIndex('sectionExtras','byInspection', inspId),
      getCustomSections(inspId)
    ]);
  }).then(function(results){
    var responses = results[0], extrasList = results[1], customSectionsList = results[2];
    var sections = inspectionSections(insp);
    var respMap = {};
    responses.forEach(function(r){ respMap[r.sectionSr+'_'+r.qIdx] = r; });
    var extrasMap = {};
    extrasList.forEach(function(ex){ extrasMap[ex.sectionSr] = ex; });

    var rows = [['Sr','Section','Ref','Question','Applicable','Finding','Remarks','Corrective Action','Preventive Action','Photos']];
    sections.forEach(function(section){
      var displayNum = sectionDisplayNumber(section, sections);
      var extras = extrasMap[section.sr];
      if(extras && extras.photos && extras.photos.length){
        rows.push([displayNum, section.name, 'General', 'General section photos', '', '', '', '', '', extras.photos.length]);
      }
      section.q.forEach(function(pair){
        var rec = respMap[section.sr+'_'+pair[2]];
        var applicable = !rec || rec.applicable===null ? '' : (rec.applicable? 'Applicable':'N/A');
        var finding = rec && rec.applicable===true ? (rec.answer==='yes'?'Yes':(rec.answer==='no'?'No':'')) : '';
        rows.push([displayNum, section.name, pair[0], pair[1], applicable, finding, (rec&&rec.remarks)||'', (rec&&rec.correctiveAction)||'', (rec&&rec.preventiveAction)||'', (rec&&rec.photos?rec.photos.length:0)]);
      });
      if(extras && extras.customFindings && extras.customFindings.length){
        extras.customFindings.forEach(function(cf){
          var finding = cf.answer==='yes'?'Yes':(cf.answer==='no'?'No':'');
          rows.push([displayNum, section.name, 'Extra', cf.text||'', 'Applicable', finding, '', cf.correctiveAction||'', cf.preventiveAction||'', (cf.photos?cf.photos.length:0)]);
        });
      }
    });
    customSectionsList.forEach(function(cs){
      var extras = extrasMap[cs.id];
      if(extras && extras.photos && extras.photos.length){
        rows.push(['Custom', cs.name, 'General', 'General section photos', '', '', '', '', '', extras.photos.length]);
      }
      if(extras && extras.customFindings && extras.customFindings.length){
        extras.customFindings.forEach(function(cf){
          var finding = cf.answer==='yes'?'Yes':(cf.answer==='no'?'No':'');
          rows.push(['Custom', cs.name, 'Extra', cf.text||'', 'Applicable', finding, '', cf.correctiveAction||'', cf.preventiveAction||'', (cf.photos?cf.photos.length:0)]);
        });
      }
    });
    var esc = function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; };
    var csv = rows.map(function(r){ return r.map(esc).join(','); }).join('\r\n');
    return downloadBlob('\ufeff'+csv, safeFileName(insp.vesselName)+'_'+insp.date+'.csv', 'text/csv;charset=utf-8').then(function(ok){
      if(ok) toast('CSV exported');
    });
  });
}

   This section is entirely inert when the page has no window.claude
   (a plain downloaded/saved copy of this file): every entry point below
   checks syncEnabled first, so the app behaves exactly as it always has
   in that case. Sync only activates when this page is opened as a
   published Claude artifact with the db and assets capabilities granted
   — at that point, the SAME inspections become available from any
   device signed into the same account that opens the same link.
   ===================================================================== */

function safeUseCapability(name){
  try{
    if(typeof window==='undefined' || !window.claude || typeof window.claude.use!=='function') return Promise.resolve(null);
    return window.claude.use(name).catch(function(){ return null; });
  } catch(e){
    return Promise.resolve(null);
  }
}
function initCloudSync(){
  return Promise.all([safeUseCapability('db'), safeUseCapability('assets'), safeUseCapability('downloads'), safeUseCapability('user')]).then(function(results){
    cloudDb = results[0];
    cloudAssets = results[1];
    cloudDownloads = results[2];
    cloudUser = results[3];
    syncEnabled = !!(cloudDb && cloudAssets);
    return syncEnabled;
  });
}
