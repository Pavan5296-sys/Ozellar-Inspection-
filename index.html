/* Add/edit one person's role. There's no way to search Supabase's user
   directory from the browser with just the anon key, so an admin assigns
   a role by typing the exact email the person will sign in with (see
   assignEmailInput below) rather than picking from a search result. */
function inviteMessageFor(email, role, name){
  var roleLabel = role==='admin' ? 'Admin' : role==='director' ? 'Director' : role==='techManager' ? 'Tech Manager' : role==='vesselManager' ? 'Vessel Manager' : 'a user of';
  var url = (typeof window!=='undefined' && window.location) ? (window.location.origin + window.location.pathname) : '';
  return 'Hi'+(name?' '+name:'')+',\n\n'+
    'You’ve been added to Ozellar All Right Inspection as '+(/^[aeiou]/i.test(roleLabel)?'an ':'a ')+roleLabel+'.\n\n'+
    'Open the app and sign in — if you don’t have an account yet, choose "Create account" — using this exact email address:\n'+email+'\n\n'+
    (url ? url+'\n\n' : '')+
    'Your access is tied to this email, so please use it to sign up.';
}
function showInviteMessage(email, role, name){
  var msg = inviteMessageFor(email, role, name);
  var backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  var panel = document.createElement('div');
  panel.className = 'form-sheet';
  panel.innerHTML = '' +
    '<h3>Invite '+escapeHtml(name||email)+'</h3>'+
    '<div class="field"><label>Send them this</label><textarea id="inviteMsgBox" rows="7" readonly style="width:100%;resize:vertical;">'+escapeHtml(msg)+'</textarea></div>'+
    '<div class="form-actions">'+
      '<button class="btn btn-outline" id="inviteCloseBtn">Close</button>'+
      '<button class="btn btn-primary" id="inviteCopyBtn">Copy</button>'+
    '</div>';
  document.body.appendChild(backdrop);
  document.body.appendChild(panel);
  function close(){ backdrop.remove(); panel.remove(); }
  backdrop.addEventListener('click', close);
  document.getElementById('inviteCloseBtn').addEventListener('click', close);
  document.getElementById('inviteCopyBtn').addEventListener('click', function(){
    var box = document.getElementById('inviteMsgBox');
    function manual(){ if(box){ box.focus(); box.select(); } toast('Selected — copy with Ctrl/Cmd+C'); }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(msg).then(function(){ toast('Invite message copied'); }).catch(manual);
      } else manual();
    }catch(e){ manual(); }
  });
}

function wireAssignUser(){

function filterHomeInspections(query){
  var q = query.trim().toLowerCase();
  var anyVisible = false;
  document.querySelectorAll('#homeInspectionList [data-search]').forEach(function(card){
    var match = q==='' || (card.getAttribute('data-search')||'').indexOf(q) > -1;
    card.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });
  var noMatches = document.getElementById('noHomeMatches');
  if(noMatches) noMatches.style.display = (!anyVisible && q!=='') ? '' : 'none';
  var clearBtn = document.getElementById('homeSearchClear');
  if(clearBtn) clearBtn.style.display = q==='' ? 'none' : '';
}

/* The vessel-name field offers the pre-fed company fleet as a dropdown
   (formVesselsCache, loaded alongside the inspection in renderForm) and
   falls back to a plain text field — exactly the old behavior — the
   moment a vessel is picked. Manual free-text entry used to live here too,
   but that job now belongs to "Add new vessel" (Home / Manage vessels) —
   this field only ever offers what's already in the fleet list. The one
   exception is editing an inspection created before this change, whose
   vesselName may not match any vessel record; that legacy name is kept
   selectable (as itself, not as a generic "manual" option) so opening
   "Edit vessel details" on it doesn't force a different vessel onto it. */
var formVesselsCache = [];

/* Shows a read-only snapshot of the picked vessel's own particulars right
   on the inspection form — not as editable fields (those live once on the
   vessel record, per VESSEL_EXTRA_FIELDS, and flow into the report
   automatically), just as visible confirmation that selecting a vessel
   really does carry its full particulars through, not only IMO/type. */
function vesselPreviewRows(v){
  var picks = ['flag','classSociety','grossTonnage','deadweight','owner','managerOperator'];
  var labelOf = {}; VESSEL_EXTRA_FIELDS.forEach(function(f){ labelOf[f.key]=f.label; });
  var rows = [];
  picks.forEach(function(key){
    if(v[key]) rows.push([labelOf[key]||key, v[key]]);
  });
  return rows;
}
function vesselPreviewHTML(v){
  var rows = v ? vesselPreviewRows(v) : [];
  if(!rows.length) return '';
  return rows.map(function(r){
    return '<div class="vp-row"><span class="vp-k">'+escapeHtml(r[0])+'</span><span class="vp-v">'+escapeHtml(r[1])+'</span></div>';
  }).join('');
}
function vesselSelectFieldHTML(vessels, matchedVessel, legacyName){
  var hasLegacy = !matchedVessel && !!legacyName;
  var initialValue = matchedVessel ? matchedVessel.id : (hasLegacy ? '__current__' : '');

  var opts;
  if(vessels.length===0 && !hasLegacy){
    opts = '<option value="" selected disabled>No vessels yet — add one below</option>';
  } else {
    opts = '<option value=""'+(initialValue===''?' selected':'')+' disabled>Select a vessel…</option>';
    if(hasLegacy){
      opts += '<option value="__current__" data-name="'+escapeHtml(legacyName)+'" selected>'+escapeHtml(legacyName)+' (not in vessel list)</option>';
    }
    vessels.forEach(function(ves){
      opts += '<option value="'+escapeHtml(ves.id)+'"'+(initialValue===ves.id?' selected':'')+'>'+escapeHtml(ves.name)+'</option>';
    });
  }

  var previewHtml = vesselPreviewHTML(matchedVessel);
  return '' +
  '<div class="field">'+
    '<label>Vessel name <span class="req">*</span></label>'+
    '<select id="fVesselSelect">'+opts+'</select>'+
    '<div id="vesselPreviewCard" class="vessel-preview-card" style="'+(previewHtml?'':'display:none;')+'">'+previewHtml+'</div>'+
    '<button type="button" class="btn-ghost" id="btnManageVesselsFromForm" style="padding:6px 0 0;">'+(vessels.length===0?'+ Add a vessel':'Manage vessel list')+'</button>'+
  '</div>';
}

function refreshVesselPhotoPreview(){
  var wrap = document.getElementById('vesselPhotoWrap');
  var removeBtn = document.getElementById('btnVesselRemovePhoto');
  if(!wrap) return;
  if(vesselPhotoDraft.blob){
    blobToDataURL(vesselPhotoDraft.blob).then(function(url){
      if(!document.getElementById('vesselPhotoWrap')) return;
      wrap.innerHTML = '<img src="'+url+'" id="vesselPhotoPreview">';
      if(removeBtn) removeBtn.style.display = '';
    }).catch(function(){});
  } else {
    wrap.innerHTML = '<div class="vessel-photo-placeholder" id="vesselPhotoPlaceholder">'+ICONS.camera+'<span>No photo yet</span></div>';
    if(removeBtn) removeBtn.style.display = 'none';
  }
}
function wireForm(){
  var backBtn = document.querySelector('.appbar .back');
  if(backBtn) backBtn.addEventListener('click', goBackFromForm);
  var cancelBtn = document.getElementById('btnCancelForm');
  if(cancelBtn) cancelBtn.addEventListener('click', goBackFromForm);

  var selectEl = document.getElementById('fVesselSelect');
  var imoInput = document.getElementById('fImo');
  var typeInput = document.getElementById('fVesselType');
  var dateInput = document.getElementById('fDate');
  var saveBtn = document.getElementById('btnSaveForm');

  /* Autofill only runs off an explicit user choice (the 'change' event),
     never on initial render — so opening "Edit vessel details" on an
     inspection never silently overwrites IMO/type that were deliberately
     different for that particular inspection. Selecting the legacy
     "(not in vessel list)" entry matches no vessel, so it's a no-op here —
     IMO/type and the preview card are simply left as they already are. */
  if(selectEl) selectEl.addEventListener('change', function(){
    var previewCard = document.getElementById('vesselPreviewCard');
    var ves = formVesselsCache.find(function(fv){ return fv.id===selectEl.value; });
    if(ves){
      imoInput.value = ves.imo||'';
      typeInput.value = ves.vesselType||'';
    }
    if(previewCard){
      var html = vesselPreviewHTML(ves);
      previewCard.innerHTML = html;
      previewCard.style.display = html ? '' : 'none';
    }
  });

  var manageLink = document.getElementById('btnManageVesselsFromForm');
  if(manageLink) manageLink.addEventListener('click', function(){ navigate('vessels'); });

  var inspTypeSeg = document.getElementById('inspTypeSeg');
  var sailingGroup = document.getElementById('sailingPeriodGroup');
  var remoteGroup = document.getElementById('remotePeriodGroup');
  if(inspTypeSeg){
    inspTypeSeg.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        inspTypeSeg.querySelectorAll('button').forEach(function(b){ b.classList.remove('selected'); });
        btn.classList.add('selected');
        var val = btn.getAttribute('data-val');
        if(sailingGroup) sailingGroup.style.display = (val==='sailing') ? '' : 'none';
        if(remoteGroup) remoteGroup.style.display = (val==='remote') ? '' : 'none';
      });
    });
  }

  var takeBtn = document.getElementById('btnVesselTakePhoto');
  var uploadBtn = document.getElementById('btnVesselUploadPhoto');
  var removeBtn = document.getElementById('btnVesselRemovePhoto');
  if(takeBtn) takeBtn.addEventListener('click', function(){
    pendingPhotoCtx = {mode:'vesselPhoto'};
    document.getElementById('cameraInput').click();
  });
  if(uploadBtn) uploadBtn.addEventListener('click', function(){
    pendingPhotoCtx = {mode:'vesselPhoto'};
    document.getElementById('galleryInput').click();
  });
  if(removeBtn) removeBtn.addEventListener('click', function(){
    vesselPhotoDraft = {blob:null, changed:true};
    refreshVesselPhotoPreview();
  });

  saveBtn.addEventListener('click', function(){
    var selectedValue = selectEl ? selectEl.value : '';
    var vesselName;
    if(selectedValue==='__current__'){
      var curOpt = selectEl.querySelector('option[value="__current__"]');
      vesselName = curOpt ? curOpt.getAttribute('data-name') : '';
    } else {
      var chosenVessel = formVesselsCache.find(function(fv){ return fv.id===selectedValue; });
      vesselName = chosenVessel ? chosenVessel.name : '';
    }
    if(!vesselName){
      toast(formVesselsCache.length===0 ? 'Add a vessel first, then create the inspection' : 'Please choose a vessel from the list');
      return;
    }
    var selectedTypeBtn = inspTypeSeg ? inspTypeSeg.querySelector('button.selected') : null;
    var selectedInspType = selectedTypeBtn ? selectedTypeBtn.getAttribute('data-val') : 'port';
    var data = {
      vesselName: vesselName,
      imo: imoInput.value,
      vesselType: typeInput.value,
      port: document.getElementById('fPort').value,
      date: dateInput.value || todayISO(),
      inspector: document.getElementById('fInspector').value,
      company: document.getElementById('fCompany').value,
      vesselPhoto: vesselPhotoDraft.blob ? {id:uid(), blob:vesselPhotoDraft.blob} : null,
      vesselPhotoChanged: vesselPhotoDraft.changed,
      inspectionType: selectedInspType || 'port',
      completionDate: document.getElementById('fCompletionDate').value,
      sailFromDate: document.getElementById('fSailFromDate').value,
      sailFromPort: document.getElementById('fSailFromPort').value,
      sailToDate: document.getElementById('fSailToDate').value,
      sailToPort: document.getElementById('fSailToPort').value,
      remoteFromDate: document.getElementById('fRemoteFromDate').value,
      remoteToDate: document.getElementById('fRemoteToDate').value
    };

    if(state.formMode==='edit'){
      updateInspectionMeta(state.inspectionId, data).then(function(){
        toast('Details updated');
        navigate('report', {inspectionId: state.inspectionId});
      });
    } else {
      createInspection(data).then(function(insp){
        navigate('sections', {inspectionId: insp.id});
      });
    }
  });
}

/* =====================================================================
   REORDERABLE LIST — generic drag-to-reorder for a flat list of sibling
   rows, each carrying a stable "data-reorder-id" and a drag handle
   marked "data-grip". Built on Pointer Events (mouse + touch alike),
   the same technique already used for dragging a photo onto another
   card (see wireThumbDrag above) — proven to work reliably on phones
   in this app already. On drop, calls onReorder(idsInNewOrder) with
   every row's data-reorder-id read back off the DOM in its new order;
   the caller is responsible for persisting that order.
   ===================================================================== */
function wireReorderableList(containerEl, onReorder){
  if(!containerEl) return;
  var DRAG_THRESHOLD = 6;
  var d = null;
  function siblingRows(){
    return Array.prototype.slice.call(containerEl.children).filter(function(el){
      return el.hasAttribute && el.hasAttribute('data-reorder-id');
    });
  }
  function onMove(e){
    if(!d || e.pointerId!==d.pointerId) return;
    var dy = e.clientY - d.startY;
    if(!d.active){
      if(Math.abs(dy) < DRAG_THRESHOLD) return;
      d.active = true;
      d.row.classList.add('reorder-dragging');
      d.placeholder = document.createElement('div');
      d.placeholder.className = 'reorder-placeholder';
      d.placeholder.style.height = d.startRect.height+'px';
      d.row.parentNode.insertBefore(d.placeholder, d.row.nextSibling);
      d.row.style.position = 'fixed';
      d.row.style.left = d.startRect.left+'px';
      d.row.style.width = d.startRect.width+'px';
      d.row.style.top = d.startRect.top+'px';
      d.row.style.zIndex = '25'; // above the sticky appbar (z-index:20) while dragging near the top
    }
    e.preventDefault();
    d.row.style.top = (d.startRect.top+dy)+'px';
    var edge = 70;
    if(e.clientY < edge) window.scrollBy(0, -14);
    else if(e.clientY > window.innerHeight-edge) window.scrollBy(0, 14);
    var rows = siblingRows().filter(function(r){ return r!==d.row; });
    var placed = false;
    for(var i=0;i<rows.length;i++){
      var rect = rows[i].getBoundingClientRect();
      if(e.clientY < rect.top+rect.height/2){
        rows[i].parentNode.insertBefore(d.placeholder, rows[i]);
        placed = true;
        break;
      }
    }
    if(!placed) containerEl.appendChild(d.placeholder);
  }
  function onUp(e){
    if(!d || (e.pointerId!=null && e.pointerId!==d.pointerId)) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    var finished = d;
    d = null;
    if(!finished.active) return; // never exceeded the threshold — a normal tap, handled elsewhere
    finished.row.classList.remove('reorder-dragging');
    finished.row.style.position = ''; finished.row.style.left = '';
    finished.row.style.top = ''; finished.row.style.width = ''; finished.row.style.zIndex = '';
    if(finished.placeholder){
      finished.placeholder.parentNode.insertBefore(finished.row, finished.placeholder);
      finished.placeholder.remove();
    }
    onReorder(siblingRows().map(function(r){ return r.getAttribute('data-reorder-id'); }));
  }
  containerEl.querySelectorAll('[data-grip]').forEach(function(grip){
    var row = grip.closest('[data-reorder-id]');
    if(!row) return;
    try{ grip.style.touchAction = 'none'; }catch(e){}
    grip.addEventListener('pointerdown', function(e){
      if(e.button!=null && e.button!==0) return;
      if(d) return;
      d = {
        pointerId: e.pointerId, row: row, startY: e.clientY,
        startRect: row.getBoundingClientRect(), active: false, placeholder: null
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    });
  });
}

  return saveSectionsTemplate().then(function(){ render(); });
}
function wireManageChecklist(){
  // Back button uses data-action="home", already wired globally in wireCurrentView().

  var addBtn = document.getElementById('btnAddChecklistSection');
  if(addBtn) addBtn.addEventListener('click', function(){
    showPrompt('New section name', '', 'e.g. Forecastle Store').then(function(name){
      if(!name) return;
      var sr = sectionsNextSr++;
      SECTIONS.push({sr: sr, zone: '', name: name, q: [], nextQid: 0});
      persistSectionsAndRerender().then(function(){ toast('Section added'); });
    });
  });

  document.querySelectorAll('#manageSectionsList [data-reorder-id]').forEach(function(row){
    var sr = parseInt(row.getAttribute('data-reorder-id'),10);
    var openEl = row.querySelector('[data-role="open"]');

      navigate('manageChecklistSection', {manageSectionSr: sr});

    if(menuBtn) menuBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var section = SECTIONS.filter(function(s){ return s.sr===sr; })[0];
      if(!section) return;
      openSheet([
        {label:'Rename section', icon:ICONS.edit, onClick:function(){
          showPrompt('Rename section', section.name).then(function(name){
            if(!name) return;
            section.name = name;
            persistSectionsAndRerender();
          });
        }},
        {label:'Delete section', icon:ICONS.trash, danger:true, onClick:function(){
          showConfirm('Delete "'+section.name+'" from the checklist? Inspections already created keep this section exactly as it is now — this only removes it from inspections started from now on.').then(function(ok){
            if(!ok) return;
            SECTIONS = SECTIONS.filter(function(s){ return s.sr!==sr; });
            persistSectionsAndRerender().then(function(){ toast('Section deleted'); });
          });
        }}
      ]);
    });
  });

  wireReorderableList(document.getElementById('manageSectionsList'), function(newOrderIds){
    var bySr = {};
    SECTIONS.forEach(function(s){ bySr[s.sr] = s; });
    var reordered = newOrderIds.map(function(id){ return bySr[parseInt(id,10)]; }).filter(Boolean);
    // Defensive: keep any section the reorder callback somehow missed, at the end.
    SECTIONS.forEach(function(s){ if(reordered.indexOf(s)===-1) reordered.push(s); });
    SECTIONS = reordered;
    saveSectionsTemplate();
  });
}

/* =====================================================================
   VIEW: VESSEL PARTICULARS FORM — full page rather than a small modal,
   since a vessel's registry/class/tonnage/machinery/ownership details add
   up to well over twenty fields; a popup would be unusable for that many.
   Grouped by VESSEL_EXTRA_FIELDS' "group" so the page reads like the
   original paper vessel-information form it's modeled on.
   ===================================================================== */
function vesselFieldGroups(){
  var order = [], byGroup = {};
  VESSEL_EXTRA_FIELDS.forEach(function(f){
    if(!byGroup[f.group]){ byGroup[f.group] = []; order.push(f.group); }
    byGroup[f.group].push(f);
  });
  return order.map(function(g){ return {group:g, fields:byGroup[g]}; });
}
function renderVesselForm(){
  var vesselId = state.vesselId;
  var readOnly = !isAdminRole();
  var loadVessel = vesselId ? idbGet('vessels', vesselId) : Promise.resolve(null);

    var dis = readOnly ? ' disabled' : '';
    var groupsHtml = vesselFieldGroups().map(function(g){
      var fieldsHtml = g.fields.map(function(f){
        return '<div class="field"><label>'+escapeHtml(f.label)+'</label>'+
          '<input type="text" id="vf_'+f.key+'" value="'+escapeHtml(v[f.key]||'')+'"'+dis+'></div>';
      }).join('');
      return '<div class="seg-label" style="margin-top:18px;">'+escapeHtml(g.group)+'</div>'+fieldsHtml;
    }).join('');

    return '' +
    '<div class="appbar">'+
      '<button class="back" data-action="back">'+ICONS.back+'</button>'+

      '<div class="field"><label>IMO number</label>'+

      '<div class="field"><label>Vessel type</label>'+
        '<input type="text" id="vf_vesselType" value="'+escapeHtml(v.vesselType||'')+'" placeholder="e.g. Bulk carrier"'+dis+'></div>'+
      groupsHtml+
      (readOnly
        ? '<div class="form-actions"><button class="btn btn-outline" id="btnCancelVesselForm" style="flex:1;">Close</button></div>'

          '</div>'
      )+
    '</div>';
  });

function renderSectionList(){
  return idbGet('inspections', state.inspectionId).then(function(insp){

    return ensureInspectionSections(insp);
  }).then(function(insp){
    if(!insp) return '<div class="loading">Redirecting\u2026</div>';
    currentInspDraft = insp;
    var sections = inspectionSections(insp);
    var sectionsTotal = inspectionTotal(sections);
    var hydrateCover = (insp && insp.vesselPhoto) ? hydratePhotoDataUrls([insp.vesselPhoto]) : Promise.resolve();
    return hydrateCover.then(function(){
    return Promise.all([
      idbGetAllByIndex('responses','byInspection', state.inspectionId),
      idbGetAllByIndex('sectionExtras','byInspection', state.inspectionId),
      getCustomSections(state.inspectionId)
    ]).then(function(results){

      var counts = computeSectionCounts(responses);

      responses.forEach(function(r){ if(isDecided(r)) totalDone++; });

          '<div class="num">'+String(displayNum).padStart(2,'0')+'</div>'+
          '<div class="name">'+escapeHtml(s.name)+'</div>'+
          '<div class="badge '+badgeClass+'">'+done+'/'+total+'</div>'+
          '<div class="chev">'+ICONS.chevron+'</div>'+
        '</button>';
      }).join('');
      var customRows = customSectionsList.map(function(cs){
        return customSectionRowHTML(cs, extrasCountMap[cs.id]||0);
      }).join('');

      return '' +
      '<div class="appbar">'+

function filterSectionList(query){
  var q = query.trim().toLowerCase();
  var anyVisible = false;
  document.querySelectorAll('#sectionListBody [data-search]').forEach(function(row){
    var match = q==='' || (row.getAttribute('data-search')||'').indexOf(q) > -1;
    row.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });
  var noMatches = document.getElementById('noSectionMatches');
  if(noMatches) noMatches.style.display = (!anyVisible && q!=='') ? '' : 'none';
  var clearBtn = document.getElementById('sectionSearchClear');
  if(clearBtn) clearBtn.style.display = q==='' ? 'none' : '';
}
function wireSectionList(){
  document.querySelectorAll('[data-open-section]').forEach(function(btn){
    btn.addEventListener('click', function(){
      navigate('section', {sectionSr: parseInt(btn.getAttribute('data-open-section'),10), customSectionId: null});
    });
  });
  document.querySelectorAll('[data-open-custom-section]').forEach(function(el){
    el.addEventListener('click', function(e){
      if(e.target.closest('[data-del-custom-section]')) return;
      navigate('section', {sectionSr: null, customSectionId: el.getAttribute('data-open-custom-section')});
    });
  });
  document.querySelectorAll('[data-del-custom-section]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var id = btn.getAttribute('data-del-custom-section');
      showConfirm('Remove this section and everything logged in it?').then(function(ok){
        if(!ok) return;
        deleteCustomSection(state.inspectionId, id).then(function(){ toast('Section removed'); render(); });
      });
    });
  });

  var searchInput = document.getElementById('sectionSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', function(){ filterSectionList(searchInput.value); });
  }
  var clearBtn = document.getElementById('sectionSearchClear');
  if(clearBtn){
    clearBtn.addEventListener('click', function(){
      searchInput.value = '';
      filterSectionList('');
      searchInput.focus();
    });

  var addSectionBtn = document.getElementById('btnAddSection');
  if(addSectionBtn) addSectionBtn.addEventListener('click', openAddSectionModal);

  var backupNowBtn = document.getElementById('btnBackupNow');
  if(backupNowBtn) backupNowBtn.addEventListener('click', function(){
    exportInspectionJSON(state.inspectionId);
  });

  var coverTakeBtn = document.getElementById('btnCoverTakePhoto');
  var coverUploadBtn = document.getElementById('btnCoverUploadPhoto');
  var coverRemoveBtn = document.getElementById('btnCoverRemovePhoto');
  if(coverTakeBtn) coverTakeBtn.addEventListener('click', function(){
    pendingPhotoCtx = {mode:'vesselPhotoLive', inspectionId: state.inspectionId};
    document.getElementById('cameraInput').click();
  });
  if(coverUploadBtn) coverUploadBtn.addEventListener('click', function(){
    pendingPhotoCtx = {mode:'vesselPhotoLive', inspectionId: state.inspectionId};
    document.getElementById('galleryInput').click();
  });
  if(coverRemoveBtn) coverRemoveBtn.addEventListener('click', function(){
    showConfirm('Remove the cover photo?').then(function(ok){
      if(!ok || !currentInspDraft) return;
      currentInspDraft.vesselPhoto = null;
      currentInspDraft.updatedAt = Date.now();
      idbPut('inspections', currentInspDraft).then(function(){ refreshCoverPhotoPreview(null); toast('Cover photo removed'); });
    });
  });

  var summaryEl = document.getElementById('listSummary');
  var debouncedListSummarySave = debounce(function(val){
    if(!currentInspDraft) return;
    currentInspDraft.summary = val;
    currentInspDraft.updatedAt = Date.now();
    idbPut('inspections', currentInspDraft);
  }, 500);
  if(summaryEl) summaryEl.addEventListener('input', function(){ debouncedListSummarySave(summaryEl.value); });

  var conclusionEl = document.getElementById('listConclusion');
  var debouncedListConclusionSave = debounce(function(val){
    if(!currentInspDraft) return;
    currentInspDraft.conclusion = val;
    currentInspDraft.updatedAt = Date.now();
    idbPut('inspections', currentInspDraft);
  }, 500);
  if(conclusionEl) conclusionEl.addEventListener('input', function(){ debouncedListConclusionSave(conclusionEl.value); });

  var reportBtn = document.getElementById('btnViewReport');
  if(reportBtn) reportBtn.addEventListener('click', function(){ navigate('report', {inspectionId: state.inspectionId}); });
}

function openAddSectionModal(){
  closeAddSectionModal();
  var backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  backdrop.id = 'addSectionBackdrop';
  var panel = document.createElement('div');
  panel.className = 'form-sheet';

function closeAddSectionModal(){

  var p = document.getElementById('addSectionPanel'); if(p) p.remove();
}

function stateClassFor(rec){
  if(!rec) return 'state-pending';
  if(rec.applicable===false) return 'state-na';
  if(rec.applicable===true && rec.answer==='yes') return 'state-ok';
  if(rec.applicable===true && rec.answer==='no') return 'state-bad';
  return 'state-pending';
}

function renderSectionDetail(){
  if(state.customSectionId) return renderCustomSectionDetail();
  return idbGet('inspections', state.inspectionId).then(function(insp){
    return ensureInspectionSections(insp);
  }).then(function(insp){
    var sections = inspectionSections(insp);
    var section = sections.filter(function(s){ return s.sr===state.sectionSr; })[0];
    return Promise.all([
      idbGetAllByIndex('responses','byInspection', state.inspectionId),
      getOrCreateSectionExtras(state.inspectionId, section.sr)
    ]).then(function(results){
      var all = results[0], extras = results[1];
    var respMap = {};
    all.forEach(function(r){ if(r.sectionSr===section.sr) respMap[r.qIdx]=r; });

    var allPhotos = (extras.photos||[]).slice();
    (extras.customFindings||[]).forEach(function(cf){ allPhotos = allPhotos.concat(cf.photos||[]); });
    section.q.forEach(function(pair){
      var rec = respMap[pair[2]];
      if(rec && rec.photos) allPhotos = allPhotos.concat(rec.photos);
    });

    return hydratePhotoDataUrls(allPhotos).then(function(anyHealed){
      if(anyHealed){
        // A local photo got healed by re-fetching it from the cloud (see
        // hydratePhotoDataUrls) — persist that fix now so this device
        // doesn't have to repeat the same network fetch every time this
        // section is opened.
        var saveChain = Promise.resolve();
        Object.keys(respMap).forEach(function(qi){
          saveChain = saveChain.then(function(){ return idbPutRaw('responses', respMap[qi]); });
        });
        saveChain.then(function(){ return idbPutRaw('sectionExtras', extras); }).catch(function(){});
      }
      var total = section.q.length, done=0;
      var cards = section.q.map(function(pair){
        var rec = respMap[pair[2]] || {applicable:null,answer:null,remarks:'',correctiveAction:'',preventiveAction:'',photos:[]};
        if(isDecided(rec)) done++;
        return questionCardHTML(section.sr, pair[2], pair[0], pair[1], rec);
      }).join('');

      return '' +
      '<div class="appbar">'+
        '<button class="back" data-action="back-to-sections">'+ICONS.back+'</button>'+
        '<div class="title-wrap"><h1>'+escapeHtml(section.name)+'</h1><p class="sub">Section '+sectionDisplayNumber(section, sections)+' of '+sections.length+'</p></div>'+
        '<div class="meta" id="sectionProgressMeta"><strong>'+done+'/'+total+'</strong>done</div>'+
      '</div>'+
      '<div style="padding-top:14px;">'+
        sectionPhotosCardHTML(extras)+
        cards+
        extrasBlockFooterHTML(extras, 'Additional findings', 'Add anything you noticed here that is not covered by the questions above.')+
      '</div>';
    });
    });
  });
}

function wireQuestionCard(card){
  var qIdx = parseInt(card.getAttribute('data-qidx'),10);
  var ref = card.getAttribute('data-ref');
  var sectionSr = state.sectionSr;
  var remarksEl = card.querySelector('[data-role="remarks"]');
  var hintEl = card.querySelector('[data-role="save-hint"]');

  function showSaved(){
    if(!hintEl) return;
    hintEl.textContent = 'Saved';
    setTimeout(function(){ if(hintEl) hintEl.textContent=''; }, 1200);
  }
  function updateProgressMeta(){
    var all = document.querySelectorAll('.qcard[data-photo-mode="question"]');
    var done=0;
    all.forEach(function(c){
      var cls = c.className;
      if(cls.indexOf('state-ok')>-1 || cls.indexOf('state-bad')>-1 || cls.indexOf('state-na')>-1) done++;
    });
    var meta = document.getElementById('sectionProgressMeta');
    if(meta) meta.innerHTML = '<strong>'+done+'/'+all.length+'</strong>done';
  }
  function applyVisual(rec){
    card.className = 'qcard '+stateClassFor(rec);
    var appBtn = card.querySelector('[data-role="applicable-seg"] [data-val="app"]');
    var naBtn = card.querySelector('[data-role="applicable-seg"] [data-val="na"]');
    var yesBtn = card.querySelector('[data-role="answer-seg"] [data-val="yes"]');
    var noBtn = card.querySelector('[data-role="answer-seg"] [data-val="no"]');
    var ansSeg = card.querySelector('[data-role="answer-seg"]');
    appBtn.className = rec.applicable===true ? 'active-app' : '';
    naBtn.className = rec.applicable===false ? 'active-na' : '';
    yesBtn.className = rec.answer==='yes' ? 'active-yes' : '';
    noBtn.className = rec.answer==='no' ? 'active-no' : '';
    if(rec.applicable===true) ansSeg.classList.remove('disabled'); else ansSeg.classList.add('disabled');
    updateProgressMeta();
  }

  card.querySelector('[data-role="applicable-seg"] [data-val="app"]').addEventListener('click', function(){
    updateResponse(state.inspectionId, sectionSr, qIdx, ref, function(rec){
      rec.applicable = true;
    }).then(function(rec){ applyVisual(rec); showSaved(); });
  });
  card.querySelector('[data-role="applicable-seg"] [data-val="na"]').addEventListener('click', function(){
    updateResponse(state.inspectionId, sectionSr, qIdx, ref, function(rec){
      rec.applicable = false;
      rec.answer = null;
    }).then(function(rec){ applyVisual(rec); showSaved(); });
  });
  card.querySelector('[data-role="answer-seg"] [data-val="yes"]').addEventListener('click', function(){
    updateResponse(state.inspectionId, sectionSr, qIdx, ref, function(rec){
      if(rec.applicable!==true) return false;
      rec.answer = 'yes';
    }).then(function(rec){ if(rec.applicable===true){ applyVisual(rec); showSaved(); } });
  });
  card.querySelector('[data-role="answer-seg"] [data-val="no"]').addEventListener('click', function(){
    updateResponse(state.inspectionId, sectionSr, qIdx, ref, function(rec){
      if(rec.applicable!==true) return false;
      rec.answer = 'no';
    }).then(function(rec){ if(rec.applicable===true){ applyVisual(rec); showSaved(); } });
  });

  var debouncedRemarksSave = debounce(function(val){
    updateResponse(state.inspectionId, sectionSr, qIdx, ref, function(rec){
      rec.remarks = val;
    }).then(showSaved);
  }, 500);
  if(remarksEl){
    remarksEl.addEventListener('input', function(){ debouncedRemarksSave(remarksEl.value); });
  }

  var correctiveActionEl = card.querySelector('[data-role="corrective-action"]');
  var preventiveActionEl = card.querySelector('[data-role="preventive-action"]');
  var debouncedCorrectiveActionSave = debounce(function(val){
    updateResponse(state.inspectionId, sectionSr, qIdx, ref, function(rec){
      rec.correctiveAction = val;
    }).then(showSaved);
  }, 500);
  if(correctiveActionEl){
    correctiveActionEl.addEventListener('input', function(){ debouncedCorrectiveActionSave(correctiveActionEl.value); });
  }
  var debouncedPreventiveActionSave = debounce(function(val){
    updateResponse(state.inspectionId, sectionSr, qIdx, ref, function(rec){
      rec.preventiveAction = val;
    }).then(showSaved);
  }, 500);
  if(preventiveActionEl){
    preventiveActionEl.addEventListener('input', function(){ debouncedPreventiveActionSave(preventiveActionEl.value); });
  }

  card.querySelector('[data-role="take-photo"]').addEventListener('click', function(){
    pendingPhotoCtx = {mode:'question', inspectionId: state.inspectionId, sectionSr: sectionSr, qIdx: qIdx, ref: ref, cardEl: card};
    document.getElementById('cameraInput').click();
  });
  card.querySelector('[data-role="upload-photo"]').addEventListener('click', function(){
    pendingPhotoCtx = {mode:'question', inspectionId: state.inspectionId, sectionSr: sectionSr, qIdx: qIdx, ref: ref, cardEl: card};
    document.getElementById('galleryInput').click();
  });

  wirePhotoThumbs(card);
}

function wireSectionPhotosCard(card){

function wireCustomCard(card){
  var customId = card.getAttribute('data-custom-id');
  var sectionSr = currentExtrasKey();
  var descEl = card.querySelector('[data-role="custom-desc"]');
  var hintEl = card.querySelector('[data-role="save-hint"]');

  function showSaved(){
    if(!hintEl) return;
    hintEl.textContent = 'Saved';
    setTimeout(function(){ if(hintEl) hintEl.textContent=''; }, 1200);
  }
  function mutate(fn){
    return updateExtras(state.inspectionId, sectionSr, function(extras){
      var cf = (extras.customFindings||[]).filter(function(c){ return c.id===customId; })[0];
      if(!cf) return false;
      fn(cf);
    }).then(function(extras){
      return (extras.customFindings||[]).filter(function(c){ return c.id===customId; })[0] || null;
    });
  }
  function applyVisual(cf){
    var stateClass = cf.answer==='yes' ? 'state-ok' : (cf.answer==='no' ? 'state-bad' : 'state-pending');
    card.className = 'qcard '+stateClass;
    var yesBtn = card.querySelector('[data-role="custom-answer-seg"] [data-val="yes"]');
    var noBtn = card.querySelector('[data-role="custom-answer-seg"] [data-val="no"]');
    yesBtn.className = cf.answer==='yes' ? 'active-yes' : '';
    noBtn.className = cf.answer==='no' ? 'active-no' : '';
  }

  if(descEl){
    var debouncedDescSave = debounce(function(val){
      mutate(function(cf){ cf.text = val; }).then(function(cf){ if(cf) showSaved(); });
    }, 500);
    descEl.addEventListener('input', function(){ debouncedDescSave(descEl.value); });
  }

  var caEl = card.querySelector('[data-role="corrective-action"]');
  var paEl = card.querySelector('[data-role="preventive-action"]');
  if(caEl){
    var debouncedCaSave = debounce(function(val){
      mutate(function(cf){ cf.correctiveAction = val; }).then(function(cf){ if(cf) showSaved(); });
    }, 500);
    caEl.addEventListener('input', function(){ debouncedCaSave(caEl.value); });
  }
  if(paEl){
    var debouncedPaSave = debounce(function(val){
      mutate(function(cf){ cf.preventiveAction = val; }).then(function(cf){ if(cf) showSaved(); });
    }, 500);
    paEl.addEventListener('input', function(){ debouncedPaSave(paEl.value); });
  }

  card.querySelector('[data-role="custom-answer-seg"] [data-val="yes"]').addEventListener('click', function(){
    mutate(function(cf){ cf.answer = 'yes'; }).then(function(cf){ if(cf){ applyVisual(cf); showSaved(); } });
  });
  card.querySelector('[data-role="custom-answer-seg"] [data-val="no"]').addEventListener('click', function(){
    mutate(function(cf){ cf.answer = 'no'; }).then(function(cf){ if(cf){ applyVisual(cf); showSaved(); } });
  });

  card.querySelector('[data-role="del-custom"]').addEventListener('click', function(){
    showConfirm('Remove this observation and its photos?').then(function(ok){
      if(!ok) return;
      updateExtras(state.inspectionId, sectionSr, function(extras){
        extras.customFindings = (extras.customFindings||[]).filter(function(c){ return c.id!==customId; });
      }).then(function(){ card.remove(); toast('Observation removed'); });
    });
  });

  card.querySelector('[data-role="take-photo"]').addEventListener('click', function(){
    pendingPhotoCtx = {mode:'custom', inspectionId: state.inspectionId, sectionSr: sectionSr, customId: customId, cardEl: card};
    document.getElementById('cameraInput').click();
  });
  card.querySelector('[data-role="upload-photo"]').addEventListener('click', function(){
    pendingPhotoCtx = {mode:'custom', inspectionId: state.inspectionId, sectionSr: sectionSr, customId: customId, cardEl: card};
    document.getElementById('galleryInput').click();
  });

  wirePhotoThumbs(card);
}

/* Resolves the right storage record (and a save callback) for whichever
   kind of card a photo thumbnail lives in: a checklist question, the
   section's general photos, or a custom (additional) finding. */
function getPhotoRecord(card){
  var mode = card.getAttribute('data-photo-mode');
  if(mode==='question'){
    var qIdx = parseInt(card.getAttribute('data-qidx'),10);
    var ref = card.getAttribute('data-ref');
    return getOrCreateResponse(state.inspectionId, state.sectionSr, qIdx, ref).then(function(rec){
      return {
        photos: rec.photos||[],
        save: function(photos){ rec.photos = photos; return saveResponse(rec); }
      };
    });
  }
  if(mode==='section'){
    return getOrCreateSectionExtras(state.inspectionId, currentExtrasKey()).then(function(extras){
      return {
        photos: extras.photos||[],
        save: function(photos){ extras.photos = photos; return saveSectionExtras(extras); }
      };
    });
  }
  if(mode==='custom'){
    var customId = card.getAttribute('data-custom-id');
    return getOrCreateSectionExtras(state.inspectionId, currentExtrasKey()).then(function(extras){
      var cf = (extras.customFindings||[]).filter(function(c){ return c.id===customId; })[0];
      return {
        photos: (cf && cf.photos) || [],
        save: function(photos){ if(cf) cf.photos = photos; return saveSectionExtras(extras); }
      };
    });
  }
  return Promise.resolve({photos:[], save:function(){ return Promise.resolve(); }});
}

/* Shared by the delete button and the move feature below — finds
   wherever a photo actually lives (a question's response, a section's
   general photos, or a custom finding) and removes it from there. */
function removePhotoFromCard(card, photoId){
  var mode = card.getAttribute('data-photo-mode');
  if(mode==='question'){
    var qIdx = parseInt(card.getAttribute('data-qidx'),10);
    var ref = card.getAttribute('data-ref');
    return updateResponse(state.inspectionId, state.sectionSr, qIdx, ref, function(rec){
      rec.photos = (rec.photos||[]).filter(function(p){ return p.id!==photoId; });
    });
  }
  if(mode==='section'){
    return updateExtras(state.inspectionId, currentExtrasKey(), function(extras){
      extras.photos = (extras.photos||[]).filter(function(p){ return p.id!==photoId; });
    });
  }
  if(mode==='custom'){
    var customId = card.getAttribute('data-custom-id');
    return updateExtras(state.inspectionId, currentExtrasKey(), function(extras){
      var cf = (extras.customFindings||[]).filter(function(c){ return c.id===customId; })[0];
      if(cf) cf.photos = (cf.photos||[]).filter(function(p){ return p.id!==photoId; });
    });
  }
  return Promise.resolve();
}
/* Every place a photo could be moved TO: every question in every fixed
   section, every fixed section's own general photos, and every custom
   section's general photos (not individual custom findings — those are
   ad-hoc additions rather than fixed slots, so they're left out of this
   list to keep it a manageable size to search). */
function buildPhotoMoveDestinations(customSectionsList){
  var dests = [];
  inspectionSections(currentInspDraft).forEach(function(sec){
    dests.push({
      kind:'section', sectionSr:sec.sr,
      mainLabel: sec.name, subLabel: 'General photos for this section',
      search: (sec.name+' general photos').toLowerCase()
    });
    sec.q.forEach(function(pair){
      var ref = pair[0], qtext = pair[1];
      dests.push({
        kind:'question', sectionSr:sec.sr, qIdx:pair[2], ref:ref,
        mainLabel: sec.name+' \u2014 '+ref, subLabel: qtext,
        search: (sec.name+' '+ref+' '+qtext).toLowerCase()
      });
    });
  });
  (customSectionsList||[]).forEach(function(cs){
    dests.push({
      kind:'section', sectionSr:cs.id,
      mainLabel: cs.name+' (custom)', subLabel: 'General photos for this section',
      search: (cs.name+' general photos custom').toLowerCase()
    });
  });
  return dests;
}
/* Adds the photo at its new home first, then removes it from the old one
   — if the add fails, the photo simply stays where it was (nothing
   lost); if the remove then fails, the worst case is a harmless
   duplicate rather than the photo vanishing. */
function performPhotoMove(sourceCard, photo, dest){
  var addPromise;
  if(dest.kind==='question'){
    addPromise = updateResponse(state.inspectionId, dest.sectionSr, dest.qIdx, dest.ref, function(rec){
      rec.photos = rec.photos || [];
      if(!rec.photos.some(function(p){ return p.id===photo.id; })) rec.photos.push(photo);
    });
  } else {
    addPromise = updateExtras(state.inspectionId, dest.sectionSr, function(extras){
      extras.photos = extras.photos || [];
      if(!extras.photos.some(function(p){ return p.id===photo.id; })) extras.photos.push(photo);
    });
  }
  return addPromise.then(function(){
    return removePhotoFromCard(sourceCard, photo.id);
  }).then(function(){
    toast('Photo moved to '+dest.mainLabel);
    render(); // refresh in place — the destination may be another card on this very screen
  }).catch(function(){
    toast('Could not move the photo \u2014 please try again');
  });
}
/* Full-screen search-and-pick overlay — the destination list can run to
   a few hundred entries (every question in every section), so a plain
   small sheet wouldn't be usable; this gets its own screen with a
   search box, built once and filtered in place rather than re-rendered
   per keystroke. */
function openMovePhotoPicker(card, photoId){
  getPhotoRecord(card).then(function(r){
    var photo = (r.photos||[]).filter(function(p){ return p.id===photoId; })[0];
    if(!photo){ toast('Photo not found'); return; }
    getCustomSections(state.inspectionId).then(function(customSectionsList){
      var dests = buildPhotoMoveDestinations(customSectionsList);
      var overlay = document.createElement('div');
      overlay.className = 'move-photo-overlay';
      overlay.id = 'movePhotoOverlay';
      var rowsHtml = dests.map(function(d, i){
        return '<div class="move-photo-row" data-dest-idx="'+i+'">'+
          '<div class="mp-main">'+escapeHtml(d.mainLabel)+'</div>'+
          '<div class="mp-sub">'+escapeHtml(d.subLabel)+'</div>'+
        '</div>';
      }).join('');
      overlay.innerHTML = '' +
        '<div class="move-photo-header">'+
          '<button class="icon-btn" id="btnCloseMovePhoto" aria-label="Close">'+ICONS.x+'</button>'+
          '<div class="search-wrap"><span class="search-icon">'+ICONS.search+'</span>'+
            '<input type="text" id="movePhotoSearch" placeholder="Search section, ref, or question" autocomplete="off">'+
          '</div>'+
        '</div>'+
        '<div class="move-photo-list" id="movePhotoList">'+rowsHtml+'</div>';
      document.body.appendChild(overlay);
      var closeBtn = document.getElementById('btnCloseMovePhoto');
      closeBtn.addEventListener('click', function(){ overlay.remove(); });
      var searchInput = document.getElementById('movePhotoSearch');
      searchInput.addEventListener('input', function(){
        var q = searchInput.value.trim().toLowerCase();
        overlay.querySelectorAll('.move-photo-row').forEach(function(row){
          var d = dests[parseInt(row.getAttribute('data-dest-idx'),10)];
          row.style.display = (q==='' || d.search.indexOf(q)>-1) ? '' : 'none';
        });
      });
      overlay.querySelectorAll('.move-photo-row').forEach(function(row){
        row.addEventListener('click', function(){
          var d = dests[parseInt(row.getAttribute('data-dest-idx'),10)];
          overlay.remove();
          performPhotoMove(card, photo, d);
        });
      });
      searchInput.focus();
    });
  });
}

function wireSingleThumb(thumb, card){
  var delBtn = thumb.querySelector('[data-role="del-photo"]');
  var moveBtn = thumb.querySelector('[data-role="move-photo"]');
  var img = thumb.querySelector('[data-role="thumb-img"]');
  img.addEventListener('error', function(){
    /* Data URLs carry the image bytes directly, so a load failure here
       means the stored photo itself is genuinely missing or corrupt —
       there's nothing to retry. Show a clear, recoverable state instead
       of the browser's raw broken-image icon. */
    thumb.classList.add('thumb-broken');
  });
  moveBtn.addEventListener('click', function(e){
    e.stopPropagation();
    openMovePhotoPicker(card, thumb.getAttribute('data-photo-id'));
  });
  delBtn.addEventListener('click', function(){
    showConfirm('Remove this photo?').then(function(ok){
      if(!ok) return;
      var photoId = thumb.getAttribute('data-photo-id');
      removePhotoFromCard(card, photoId).then(function(){ thumb.remove(); toast('Photo removed'); });
    });
  });
  img.addEventListener('click', function(){
    if(thumb.__justDragged){ thumb.__justDragged = false; return; }
    var photoId = thumb.getAttribute('data-photo-id');
    getPhotoRecord(card).then(function(r){
      var photo = r.photos.filter(function(p){ return p.id===photoId; })[0];
      if(!photo) return;
      if(photo.__dataUrl) return openLightbox(photo.__dataUrl);
      if(photo.blob) return blobToDataURL(photo.blob).then(openLightbox).catch(function(){});
    });
  });
}
/* Converts a card currently on screen into the same {kind, sectionSr,
   qIdx, ref} shape performPhotoMove() expects — used by drag-and-drop,
   where the destination is a DOM element the pointer landed on, not a
   row picked from the search list. Custom-finding cards are deliberately
   not valid drop targets (their photos aren't in the fixed destination
   list built for the search picker either); dragging onto one is a
   no-op, same as dragging onto the source card itself. */
function destinationFromCard(card){
  var mode = card.getAttribute('data-photo-mode');
  if(mode!=='question' && mode!=='section') return null;
  var fixedSection = state.sectionSr!=null ? inspectionSections(currentInspDraft).filter(function(s){ return s.sr===state.sectionSr; })[0] : null;
  var sectionName = fixedSection ? fixedSection.name : 'This section';
  if(mode==='question'){
    return {
      kind:'question', sectionSr: state.sectionSr,
      qIdx: parseInt(card.getAttribute('data-qidx'),10), ref: card.getAttribute('data-ref'),
      mainLabel: sectionName+' \u2014 '+card.getAttribute('data-ref')
    };
  }
  return {kind:'section', sectionSr: currentExtrasKey(), mainLabel: sectionName+' \u2014 General photos'};
}
/* Cursor/touch drag-and-drop between photo slots on the CURRENT section
   screen (question cards and the section's general-photos card — the
   same destinations the "move" button's search picker offers, just
   reached by dragging instead of searching). Moving a photo to a
   different section still goes through that search picker; dragging
   across sections isn't attempted here since the target would be off
   screen and hard to hit reliably. Built on Pointer Events so the same
   code handles mouse and touch. */
var thumbDragState = null;
function wireThumbDrag(thumb, card){
  var DRAG_THRESHOLD = 8;
  try{ thumb.style.touchAction = 'none'; }catch(e){}

  function onMove(e){
    var d = thumbDragState;
    if(!d || d.thumb!==thumb || e.pointerId!==d.pointerId) return;
    var dx = e.clientX-d.startX, dy = e.clientY-d.startY;
    if(!d.active){
      if(Math.abs(dx)<DRAG_THRESHOLD && Math.abs(dy)<DRAG_THRESHOLD) return;
      d.active = true;
      thumb.classList.add('dragging');
      var ghost = thumb.cloneNode(true);
      ghost.className = 'thumb drag-ghost';
      var extraBtns = ghost.querySelectorAll('.del, .move');
      extraBtns.forEach(function(b){ b.remove(); });
      document.body.appendChild(ghost);
      d.ghost = ghost;
    }
    e.preventDefault();
    if(d.ghost){
      d.ghost.style.left = (e.clientX-32)+'px';
      d.ghost.style.top = (e.clientY-32)+'px';
    }
    // Edge auto-scroll so a long section (many questions) can still be reached mid-drag.
    var edge = 70;
    if(e.clientY < edge) window.scrollBy(0, -14);
    else if(e.clientY > window.innerHeight-edge) window.scrollBy(0, 14);
    // Hit-test for a droppable card under the pointer — the whole card is
    // the target, not just its (sometimes short and easy-to-miss) photo
    // strip, since a card with few or no photos yet has very little of
    // that strip to actually land on.
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var candidateCard = under ? under.closest('.qcard') : null;
    if(candidateCard===d.sourceCard) candidateCard = null; // dropping on its own card is a no-op
    if(candidateCard && !destinationFromCard(candidateCard)) candidateCard = null; // e.g. a custom-finding card
    if(candidateCard!==d.dropCard){
      if(d.dropCard) d.dropCard.classList.remove('drop-target-card');
      if(candidateCard) candidateCard.classList.add('drop-target-card');
      d.dropCard = candidateCard;
    }
  }
  function onUp(e){
    var d = thumbDragState;
    if(!d || d.thumb!==thumb || (e.pointerId!=null && e.pointerId!==d.pointerId)) return;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    thumbDragState = null;
    thumb.classList.remove('dragging');
    if(d.ghost) d.ghost.remove();
    if(d.dropCard) d.dropCard.classList.remove('drop-target-card');
    if(!d.active) return; // never exceeded the threshold — treat as a normal tap, handled elsewhere
    thumb.__justDragged = true;
    if(!d.dropCard) return; // released somewhere that isn't a valid, different destination
    var dest = destinationFromCard(d.dropCard);
    getPhotoRecord(d.sourceCard).then(function(r){
      var photo = (r.photos||[]).filter(function(p){ return p.id===d.photoId; })[0];
      if(photo) performPhotoMove(d.sourceCard, photo, dest);
    });
  }
  thumb.addEventListener('pointerdown', function(e){
    if(e.target.closest('.del, .move')) return; // let those buttons handle their own tap
    if(e.button!=null && e.button!==0) return; // left click / primary touch only
    if(thumbDragState) return; // a previous drag didn't clean up somehow — don't stack a second one
    thumbDragState = {
      pointerId: e.pointerId, thumb: thumb, sourceCard: card,
      photoId: thumb.getAttribute('data-photo-id'),
      startX: e.clientX, startY: e.clientY, active: false, ghost: null, dropCard: null
    };
    /* Tracking pointermove/up on the document, not this 64x64px thumbnail,
       is the important part: relying on the thumbnail's own listener (or
       on setPointerCapture, which Safari has a long history of supporting
       inconsistently) means events silently stop arriving the moment a
       real finger drag moves past such a small element — which reads as
       "nothing happens" exactly like this was reported. Document-level
       listeners keep receiving pointermove for this pointerId anywhere on
       the screen regardless of capture support. */
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}
function wirePhotoThumbs(card){
  card.querySelectorAll('.thumb').forEach(function(thumb){
    wireSingleThumb(thumb, card);
    wireThumbDrag(thumb, card);
  });
}

function handlePhotoFiles(e){
  var files = Array.prototype.slice.call(e.target.files||[]);
  e.target.value = '';
  if(!files.length || !pendingPhotoCtx) return;
  var ctx = pendingPhotoCtx;

  if(ctx.mode==='vesselPhoto'){
    compressImage(files[0]).then(function(compressed){
      vesselPhotoDraft = {blob: compressed, changed:true};
      refreshVesselPhotoPreview();
    });
    return;
  }

  if(ctx.mode==='vesselPhotoLive'){
    compressImage(files[0]).then(function(compressed){
      var photo = {id: uid(), blob: compressed};
      if(!currentInspDraft) return;
      currentInspDraft.vesselPhoto = photo;
      currentInspDraft.updatedAt = Date.now();
      idbPut('inspections', currentInspDraft).then(function(){
        refreshCoverPhotoPreview(compressed);
        toast('Cover photo added');
      });
    });
    return;
  }

  getCurrentPhotoCount(ctx).then(function(existingCount){
    var remaining = Math.max(0, MAX_PHOTOS_PER_TARGET - existingCount);
    var filesToAdd = files.slice(0, remaining);
    var skipped = files.length - filesToAdd.length;

    var chain = Promise.resolve();
    filesToAdd.forEach(function(file){
      chain = chain.then(function(){ return compressImage(file); }).then(function(compressed){
        var photo = {id: uid(), blob: compressed};
        var addPromise;
        if(ctx.mode==='question'){
          addPromise = updateResponse(ctx.inspectionId, ctx.sectionSr, ctx.qIdx, ctx.ref, function(rec){
            rec.photos = rec.photos || [];
            rec.photos.push(photo);
          });
        } else if(ctx.mode==='section'){
          addPromise = updateExtras(ctx.inspectionId, ctx.sectionSr, function(extras){
            extras.photos = extras.photos || [];
            extras.photos.push(photo);
          });
        } else if(ctx.mode==='custom'){
          addPromise = updateExtras(ctx.inspectionId, ctx.sectionSr, function(extras){
            var cf = (extras.customFindings||[]).filter(function(c){ return c.id===ctx.customId; })[0];
            if(cf){ cf.photos = cf.photos || []; cf.photos.push(photo); }
          });
        } else {
          addPromise = Promise.resolve();
        }
        return addPromise.then(function(){
          return hydratePhotoDataUrls([photo]).then(function(){
            if(ctx.cardEl && ctx.cardEl.isConnected){
              var row = ctx.cardEl.querySelector('[data-role="thumb-row"]');
              if(row){
                row.insertAdjacentHTML('beforeend', photoThumbHTML(photo));
                var newThumb = row.querySelector('[data-photo-id="'+photo.id+'"]');
                if(newThumb) wireSingleThumb(newThumb, ctx.cardEl);
              }
            }
          });
        });
      });
    });
    chain.then(function(){
      if(skipped>0){
        toast(filesToAdd.length
          ? (filesToAdd.length>1?'Photos added':'Photo added')+' — 15 photo limit reached, '+skipped+' not added'
          : 'Photo limit reached — max 15 photos per item');
      } else {
        toast(filesToAdd.length>1 ? 'Photos added' : 'Photo added');
      }
    });
  });
}

/* Maximum photos allowed per question, section, or custom finding. */
var MAX_PHOTOS_PER_TARGET = 15;
function getCurrentPhotoCount(ctx){
  if(ctx.mode==='question'){
    return getOrCreateResponse(ctx.inspectionId, ctx.sectionSr, ctx.qIdx, ctx.ref).then(function(rec){
      return (rec.photos||[]).length;
    });
  } else if(ctx.mode==='section'){
    return getOrCreateSectionExtras(ctx.inspectionId, ctx.sectionSr).then(function(extras){
      return (extras.photos||[]).length;
    });
  } else if(ctx.mode==='custom'){
    return getOrCreateSectionExtras(ctx.inspectionId, ctx.sectionSr).then(function(extras){
      var cf = (extras.customFindings||[]).filter(function(c){ return c.id===ctx.customId; })[0];
      return cf && cf.photos ? cf.photos.length : 0;
    });
  }
  return Promise.resolve(0);
}

/* =====================================================================
   VIEW: REPORT
   ===================================================================== */
function renderReport(){
  var insp, sections, sectionsTotal;
  return idbGet('inspections', state.inspectionId).then(function(i){
    insp = i;
    if(insp && !guardVesselAccess(insp.vesselName)) return null;
    currentInspDraft = insp;
    return ensureInspectionSections(insp);
  }).then(function(fullInsp){
    if(!fullInsp) return null;
    sections = inspectionSections(fullInsp);
    sectionsTotal = inspectionTotal(sections);
    return Promise.all([
      idbGetAllByIndex('responses','byInspection', state.inspectionId),
      idbGetAllByIndex('sectionExtras','byInspection', state.inspectionId),
      getCustomSections(state.inspectionId),
      findVesselByName(insp.vesselName)
    ]);
  }).then(function(results){
    if(!results) return '<div class="loading">Redirecting\u2026</div>';
    var responses = results[0], extrasList = results[1], customSectionsList = results[2], vessel = results[3];
    var stats = {done:0,deficiencies:0,photos:0,notApplicable:0,ok:0,pending:0,extra:0};
    responses.forEach(function(r){
      if(isDecided(r)) stats.done++; else stats.pending++;
      if(r.applicable===false) stats.notApplicable++;
      if(r.applicable===true && r.answer==='yes') stats.ok++;
      if(r.applicable===true && r.answer==='no') stats.deficiencies++;
      stats.photos += (r.photos? r.photos.length : 0);
    });
    stats.pending = sectionsTotal - stats.done;
    extrasList.forEach(function(ex){
      stats.photos += (ex.photos? ex.photos.length : 0);
      (ex.customFindings||[]).forEach(function(cf){
        stats.extra++;
        stats.photos += (cf.photos? cf.photos.length : 0);
        if(cf.answer==='no') stats.deficiencies++;
      });
    });

    var findings = collectDeficiencyFindings(responses, extrasList, customSectionsList, sections);
    var findingsHtml = findings.length ? findings.map(function(f){
      var openAttr = f.isCustom
        ? 'data-open-custom-section="'+escapeHtml(String(f.sectionKey))+'"'
        : 'data-open-section="'+f.sectionKey+'"';
      return '' +
      '<div class="finding" '+openAttr+'>'+
        '<div class="fmeta">'+escapeHtml(f.sectionName)+' ('+escapeHtml(f.refLabel)+')</div>'+
        '<div class="fq">'+escapeHtml(f.qtext)+'</div>'+
        (f.remarks ? '<div class="frem">"'+escapeHtml(f.remarks)+'"</div>' : '')+
      '</div>';
    }).join('') : '<div class="empty-state" style="margin:6px 16px 0;"><p>No observations recorded yet.</p></div>';

    var statusBtnLabel = insp.status==='completed' ? 'Reopen inspection' : 'Mark inspection complete';

    return buildPrintableReport(insp, responses, extrasList, customSectionsList, vessel).then(function(printHtml){
      return '' +
      '<div class="appbar">'+
        '<button class="back" data-action="back-to-sections">'+ICONS.back+'</button>'+
        '<div class="title-wrap"><h1>Report</h1><p class="sub">'+escapeHtml(insp.vesselName||'')+'</p></div>'+
      '</div>'+
      '<a class="edit-link" data-action="edit-details" href="javascript:void(0)">Edit vessel details</a>'+
      '<div class="report-section-title">Summary</div>'+
      '<div class="section-pad"><div class="remarks-wrap" style="margin-top:0;">'+
        '<textarea id="reportSummary" placeholder="Write a summary of this inspection. This must be completed before the inspection can be marked complete.">'+escapeHtml(insp.summary||'')+'</textarea>'+
      '</div></div>'+
      '<div class="stat-grid">'+
        '<div class="stat"><div class="n">'+sectionsTotal+'</div><div class="l">Total questions</div></div>'+
        '<div class="stat ok"><div class="n">'+stats.ok+'</div><div class="l">Satisfactory</div></div>'+
        '<div class="stat bad"><div class="n">'+stats.deficiencies+'</div><div class="l">Observations</div></div>'+
        '<div class="stat"><div class="n">'+stats.notApplicable+'</div><div class="l">Not applicable</div></div>'+
        '<div class="stat warn"><div class="n">'+stats.pending+'</div><div class="l">Pending</div></div>'+
        '<div class="stat"><div class="n">'+stats.photos+'</div><div class="l">Photos attached</div></div>'+
        '<div class="stat"><div class="n">'+stats.extra+'</div><div class="l">Additional findings</div></div>'+
      '</div>'+
      '<div class="report-section-title">Observation list</div>'+
      findingsHtml+
      '<div class="report-section-title">Conclusion</div>'+
      '<div class="section-pad"><div class="remarks-wrap" style="margin-top:0;">'+
        '<textarea id="reportConclusion" placeholder="Write a conclusion for this inspection. This must be completed before the inspection can be marked complete.">'+escapeHtml(insp.conclusion||'')+'</textarea>'+
      '</div></div>'+
      '<div class="report-actions">'+
        '<button class="btn btn-primary" id="btnToggleStatus">'+statusBtnLabel+'</button>'+
        '<button class="btn btn-outline" id="btnPrintReport">'+ICONS.printer+'Preview report'+'</button>'+
        '<button class="btn btn-outline" id="btnExportJson">'+ICONS.json+'Export backup (JSON)</button>'+
        '<button class="btn btn-outline" id="btnExportCsv">'+ICONS.csv+'Export CSV</button>'+
      '</div>'+
      '<div class="print-only" id="printArea">'+printHtml+'</div>';
    });
  });
}

function wireReport(){
  var editLink = document.querySelector('[data-action="edit-details"]');
  if(editLink) editLink.addEventListener('click', function(){ navigate('form', {formMode:'edit', inspectionId: state.inspectionId}); });

  document.querySelectorAll('[data-open-section]').forEach(function(el){
    el.addEventListener('click', function(){
      navigate('section', {sectionSr: parseInt(el.getAttribute('data-open-section'),10), customSectionId: null});
    });
  });
  document.querySelectorAll('[data-open-custom-section]').forEach(function(el){
    el.addEventListener('click', function(){
      navigate('section', {sectionSr: null, customSectionId: el.getAttribute('data-open-custom-section')});
    });
  });

  var summaryEl = document.getElementById('reportSummary');
  var debouncedSummarySave = debounce(function(val){
    if(!currentInspDraft) return;
    currentInspDraft.summary = val;
    currentInspDraft.updatedAt = Date.now();
    idbPut('inspections', currentInspDraft);
  }, 500);
  if(summaryEl) summaryEl.addEventListener('input', function(){ debouncedSummarySave(summaryEl.value); });

  var conclusionEl = document.getElementById('reportConclusion');
  var debouncedConclusionSave = debounce(function(val){
    if(!currentInspDraft) return;
    currentInspDraft.conclusion = val;
    currentInspDraft.updatedAt = Date.now();
    idbPut('inspections', currentInspDraft);
  }, 500);
  if(conclusionEl) conclusionEl.addEventListener('input', function(){ debouncedConclusionSave(conclusionEl.value); });

  var toggleBtn = document.getElementById('btnToggleStatus');
  if(toggleBtn) toggleBtn.addEventListener('click', function(){
    if(!currentInspDraft) return;
    var goingToComplete = currentInspDraft.status !== 'completed';
    if(goingToComplete && (!(currentInspDraft.summary||'').trim() || !(currentInspDraft.conclusion||'').trim())){
      toast('Add a Summary and Conclusion before marking this inspection complete');
      return;
    }
    currentInspDraft.status = goingToComplete ? 'completed' : 'in_progress';
    currentInspDraft.updatedAt = Date.now();
    var inspectionId = state.inspectionId;
    idbPut('inspections', currentInspDraft).then(function(){
      toast('Status updated');
      render();
      if(goingToComplete) showReportPreviewAndDownload(inspectionId);
    });
  });

  var printBtn = document.getElementById('btnPrintReport');
  if(printBtn) printBtn.addEventListener('click', function(){
    showReportPreviewAndDownload(state.inspectionId);
  });

  var jsonBtn = document.getElementById('btnExportJson');
  if(jsonBtn) jsonBtn.addEventListener('click', function(){ exportInspectionJSON(state.inspectionId); });

  var csvBtn = document.getElementById('btnExportCsv');
  if(csvBtn) csvBtn.addEventListener('click', function(){ exportInspectionCSV(state.inspectionId); });
}

/* =====================================================================
   PRINTABLE REPORT BUILDER
   ===================================================================== */
/* Wraps an already-built print-report HTML fragment into a complete,
   self-contained document (reusing the app's own current stylesheet, so
   it looks identical) that can be saved and opened outside any sandboxed
   frame — a guaranteed-working path to print or save as PDF. */
/* =====================================================================
   PDF REPORT — a real, generated PDF (not a browser print-to-PDF), using
   jsPDF loaded from a pinned CDN build. Colors are baked directly into
   the embedded JPEG data, so there is no browser/printer pipeline left
   that could turn photos grayscale. This is a progressive enhancement:
   if the library failed to load (e.g. no internet the first time this
   page was opened), pdfAvailable() is false and the app falls back to
   the HTML-based print/save flow already built — nothing regresses.
   ===================================================================== */
function pdfAvailable(){
  return typeof window!=='undefined' && window.jspdf && typeof window.jspdf.jsPDF==='function';
}
var PDF_MARGIN = 15;
var PDF_PAGE_W = 210;
var PDF_PAGE_H = 297;
var PDF_CONTENT_W = PDF_PAGE_W - PDF_MARGIN*2;
var PDF_COLOR = {
  navy: [11,33,56], teal: [10,95,103], good: [31,138,87], bad: [193,67,42],
  pending: [180,140,20], na: [133,146,160], ink: [30,38,46], grey: [110,118,126],
  faint: [150,155,160], border: [222,226,229], panelBg: [247,249,250], badBg: [252,238,233]
};

/* Real devices can take noticeably longer to decode a photo than a laptop
   does — slower CPU, thermal throttling, and this can be the 50th photo
   decoded in one report rather than the 1st. The watchdogs below only
   exist to stop PDF generation from hanging forever on a genuinely stuck
   decode (corrupt data, or — specific to our own test environment —
   jsdom's Image never firing either event for data: URIs at all); a real
   browser always fires onload or onerror eventually, so a generous
   timeout costs nothing in the normal case. A short timeout, on the other
   hand, was firing on ordinary phones before a legitimate decode had even
   finished — and the fallback that ran instead could then fail jsPDF's
   stricter JPEG check, so the photo just silently never appeared. That
   failure mode was only ever reachable on the slower devices where the
   timeout was easiest to trip, which is exactly why it showed up on
   mobile and never on a laptop. */
var PDF_IMAGE_DECODE_TIMEOUT_MS = 8000;

function pdfLoadImageSize(dataUrl){
  return new Promise(function(resolve){
    var done = false;
    function finish(result){ if(done) return; done = true; resolve(result); }
    var img = new Image();
    img.onload = function(){ finish({w:img.naturalWidth||4, h:img.naturalHeight||3}); };
    img.onerror = function(){ finish({w:4, h:3}); }; // still draw it, just at a guessed ratio
    img.src = dataUrl;
    setTimeout(function(){ finish({w:4, h:3}); }, PDF_IMAGE_DECODE_TIMEOUT_MS);
  });
}
/* jsPDF's addImage trusts whatever format string you pass it — it does not
   sniff the actual bytes. Every call in this file passes 'JPEG', which is
   only true if the stored photo really is a JPEG. compressImage() normally
   guarantees that, but a photo can still end up in a different format: an
   iPhone photo whose original file type made the browser skip re-encoding,
   or a photo round-tripped through the cloud asset store with a generic
   content-type. In either case addImage silently fails (caught and
   swallowed by the try/catch around it) and the photo just never appears —
   with no error, so it looks like a photo that was simply never there.
   Redrawing every photo onto a canvas and re-exporting it here guarantees
   real JPEG bytes going into the PDF regardless of what was actually
   stored, so the hardcoded 'JPEG' label is always true by construction.
   The natural width/height are captured from this same decode and handed
   back alongside the URL, so callers that need them for layout (every
   photo row, the cover photo) don't have to decode the image a second
   time just to measure it — halving the decode work per photo, which
   matters most on exactly the slower devices this function exists to
   protect.
   The canvas itself is capped at PDF_SAFE_IMAGE_MAX_DIM rather than the
   photo's native size: compressImage should already have every photo down
   to that size before it's ever stored, but a photo captured on a device
   where that resize got skipped (see the note on compressImage) can still
   be sitting at full original resolution — several thousand pixels per
   side. A canvas that large can exceed a phone's memory limits in a way a
   laptop never hits, so without this cap that one oversized photo would
   fail here and vanish from the PDF on mobile only, exactly like the
   format mismatch above. Capping it costs nothing for a normal, already-
   compressed photo (it's already at or under this size) and makes an
   oversized one safe everywhere instead of only on hardware with enough
   memory to brute-force it. */
var PDF_SAFE_IMAGE_MAX_DIM = 1600;
function pdfSafeImageDataUrl(dataUrl){
  return new Promise(function(resolve){
    if(!dataUrl){ resolve(null); return; }
    var done = false;
    function finish(result){ if(done) return; done = true; resolve(result); }
    var img = new Image();
    img.onload = function(){
      var natW = img.naturalWidth || null, natH = img.naturalHeight || null;
      var w = natW, h = natH;
      if(w && h && (w>PDF_SAFE_IMAGE_MAX_DIM || h>PDF_SAFE_IMAGE_MAX_DIM)){
        if(w>h){ h = Math.round(h*PDF_SAFE_IMAGE_MAX_DIM/w); w = PDF_SAFE_IMAGE_MAX_DIM; }
        else { w = Math.round(w*PDF_SAFE_IMAGE_MAX_DIM/h); h = PDF_SAFE_IMAGE_MAX_DIM; }
      }
      try{
        var canvas = document.createElement('canvas');
        canvas.width = w || 1;
        canvas.height = h || 1;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w||1, h||1);
        finish({url: canvas.toDataURL('image/jpeg', 0.85), w:natW, h:natH});
      }catch(e){
        logDiagnostic('pdf_canvasEncodeThrew', {errName: e && e.name, errMessage: e && e.message, w: w, h: h});
        finish({url: dataUrl, w:natW, h:natH});
      } // canvas failed for some other reason — try the original rather than lose the photo outright
    };
    img.onerror = function(){ finish(null); }; // genuinely undecodable even by the browser itself
    img.src = dataUrl;
    setTimeout(function(){ finish({url: dataUrl, w:null, h:null}); }, PDF_IMAGE_DECODE_TIMEOUT_MS);
  });
}
function pdfFitBox(natW, natH, maxW, maxH){
  var ratio = Math.min(maxW/natW, maxH/natH, 1);
  return {w: natW*ratio, h: natH*ratio};
}
function pdfEnsureSpace(doc, y, needed){
  if(y + needed > PDF_PAGE_H - PDF_MARGIN){
    doc.addPage();
    return PDF_MARGIN;
  }
  return y;
}
/* Draws a wrapping row of photo thumbnails starting at (x,y), paginating
   if it runs off the bottom of the page. Returns the Y position after
   the last row drawn. photos is an array of {url, w, h} as produced by
   photoDataUrls: w/h come pre-measured from the same decode that already
   made the URL safe, so this only falls back to a fresh decode
   (pdfLoadImageSize) for the rare entry that doesn't have them. */
function pdfAddPhotoRow(doc, photos, x, y, maxWidth, thumbH){
  if(!photos || !photos.length) return Promise.resolve(y);
  return Promise.all(photos.map(function(p){
    if(p.w && p.h) return {w:p.w, h:p.h};
    return pdfLoadImageSize(p.url);
  })).then(function(sizes){
    var curX = x, rowH = 0, gap = 4;
    for(var i=0;i<photos.length;i++){
      var size = sizes[i];
      if(!size) continue;
      var fit = pdfFitBox(size.w, size.h, thumbH*1.4, thumbH);
      if(curX + fit.w > x + maxWidth){
        curX = x; y += rowH + gap; rowH = 0;
      }
      y = pdfEnsureSpace(doc, y, thumbH);
      if(curX!==x && y===PDF_MARGIN) curX = x; // a page break also resets the row
      try{ doc.addImage(photos[i].url, 'JPEG', curX, y, fit.w, fit.h); }catch(e){
        logDiagnostic('pdf_addImageThrew', {errName: e && e.name, errMessage: e && e.message, urlPrefix: (photos[i].url||'').slice(0,40), w: fit.w, h: fit.h});
      }
      doc.setDrawColor(PDF_COLOR.border[0],PDF_COLOR.border[1],PDF_COLOR.border[2]);
      doc.setLineWidth(0.35);
      doc.rect(curX, y, fit.w, fit.h);
      curX += fit.w + gap;
      rowH = Math.max(rowH, fit.h);
    }
    return y + rowH;
  });
}
function pdfHeading(doc, text, y){
  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(11,33,56);
  y = pdfEnsureSpace(doc, y, 14);
  doc.text(text, PDF_MARGIN, y);
  doc.setDrawColor(11,33,56); doc.setLineWidth(0.6);
  doc.line(PDF_MARGIN, y+2.5, PDF_PAGE_W-PDF_MARGIN, y+2.5);
  return y + 10;
}
/* Packs [label, value] rows three to a row (label above value in each of
   three columns) instead of one per line, to fit a long particulars list
   — vessel details alone can run 20+ rows — into far less page space.
   Row height adapts to whichever of the three values wraps to the most
   lines, so a longer value (e.g. a maker/model string) doesn't clip. */
function pdfCompactRows(doc, rows, y){
  var colGap = 4;
  var colW = (PDF_CONTENT_W - colGap*2) / 3;
  for(var i=0; i<rows.length; i+=3){
    var group = [rows[i], rows[i+1], rows[i+2]];
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    var lineArrays = group.map(function(g){ return g ? doc.splitTextToSize(String(g[1]), colW-2) : []; });
    var maxLines = Math.max(1, lineArrays[0].length, lineArrays[1].length, lineArrays[2].length);
    var rowH = 5 + maxLines*4.2 + 3;
    y = pdfEnsureSpace(doc, y, rowH);
    group.forEach(function(g, ci){
      if(!g) return;
      var x = PDF_MARGIN + ci*(colW+colGap);
      doc.setFont('helvetica','bold'); doc.setFontSize(7.5); doc.setTextColor(120,120,120);
      doc.text(g[0], x, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(20,20,20);
      doc.text(lineArrays[ci], x, y+4.6);
    });
    y += rowH;
  }
  return y;
}
function pdfBodyText(doc, text, x, y, maxWidth, size){
  doc.setFont('helvetica','normal'); doc.setFontSize(size||10.5); doc.setTextColor(30,38,46);
  var lines = doc.splitTextToSize(text||'', maxWidth);
  for(var i=0;i<lines.length;i++){
    y = pdfEnsureSpace(doc, y, 6);
    doc.text(lines[i], x, y);
    y += 5.2;
  }
  return y;
}
function pdfStatusTag(doc, label, x, y, color){
  doc.setFont('helvetica','bold'); doc.setFontSize(8);
  var w = doc.getTextWidth(label) + 5;
  doc.setFillColor(color[0],color[1],color[2]);
  doc.roundedRect(x, y-3.6, w, 5, 1, 1, 'F');
  doc.setTextColor(255,255,255);
  doc.text(label, x+2.5, y);
  doc.setTextColor(30,38,46);
  return x + w + 3;
}
/* Same tag, but positioned so its right edge lands exactly at rightEdgeX —
   used to keep status tags flush with the page margin regardless of how
   wide the label text is ("Satisfactory" vs "N/A"). */
function pdfStatusTagRight(doc, label, rightEdgeX, y, color){
  doc.setFont('helvetica','bold'); doc.setFontSize(8);
  var w = doc.getTextWidth(label) + 5;
  return pdfStatusTag(doc, label, rightEdgeX - w, y, color);
}
/* A filled, colored section header band spanning the content width —
   replacing a plain thin line with something that reads clearly as the
   start of a new part of the report at a glance. */
function pdfSectionBand(doc, text, y){
  y = pdfEnsureSpace(doc, y, 26); // band height plus enough headroom that something follows it on the same page
  doc.setFillColor(PDF_COLOR.navy[0],PDF_COLOR.navy[1],PDF_COLOR.navy[2]);
  doc.roundedRect(PDF_MARGIN, y, PDF_CONTENT_W, 9, 1.2, 1.2, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);
  doc.text(text, PDF_MARGIN+4, y+6.2);
  doc.setTextColor(PDF_COLOR.ink[0],PDF_COLOR.ink[1],PDF_COLOR.ink[2]);
  return y + 14;
}
/* A light, bordered callout box for corrective/preventive action text —
   mirrors the same red-tinted panel used for this in the app itself, so
   the report visually matches the app rather than looking like plain
   paragraphs bolted onto the bottom of a question. */
function pdfActionCallout(doc, items, x, y, width){
  items = items.filter(function(it){ return it && it.text; });
  if(!items.length) return y;
  // Measure total height first so the box can be drawn before its text.
  var pad = 3.5, lineH = 5, labelH = 4.5, gapBetween = 2;
  var wrapped = items.map(function(it){
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    return doc.splitTextToSize(it.text, width - pad*2);
  });
  var boxH = pad*2;
  wrapped.forEach(function(lines, i){ boxH += labelH + lines.length*lineH + (i<wrapped.length-1?gapBetween:0); });
  y = pdfEnsureSpace(doc, y, boxH+3);
  doc.setFillColor(PDF_COLOR.badBg[0],PDF_COLOR.badBg[1],PDF_COLOR.badBg[2]);
  doc.setDrawColor(PDF_COLOR.bad[0],PDF_COLOR.bad[1],PDF_COLOR.bad[2]);
  doc.setLineWidth(0.3);
  doc.roundedRect(x, y, width, boxH, 1.5, 1.5, 'FD');
  var ty = y + pad + 3.2;
  items.forEach(function(it, i){
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(PDF_COLOR.bad[0],PDF_COLOR.bad[1],PDF_COLOR.bad[2]);
    doc.text(it.label, x+pad, ty);
    ty += labelH;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(PDF_COLOR.ink[0],PDF_COLOR.ink[1],PDF_COLOR.ink[2]);
    wrapped[i].forEach(function(line){ doc.text(line, x+pad, ty); ty += lineH; });
    if(i<items.length-1) ty += gapBetween;
  });
  return y + boxH + 4;
}
/* A row of small stat cards (count + label), matching the app's own
   report screen, used to give the Summary page a real at-a-glance
   overview instead of just the free-text summary paragraph. */
function pdfStatCards(doc, cards, y){
  var gap = 4, cols = Math.max(1, Math.min(cards.length, 5)), w = (PDF_CONTENT_W - gap*(cols-1))/cols, h = 22;
  y = pdfEnsureSpace(doc, y, h+6);
  cards.forEach(function(c, i){
    var col = i % cols, row = Math.floor(i/cols);
    var cx = PDF_MARGIN + col*(w+gap), cy = y + row*(h+gap);
    doc.setFillColor(PDF_COLOR.panelBg[0],PDF_COLOR.panelBg[1],PDF_COLOR.panelBg[2]);
