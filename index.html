/* Converts a Blob to a plain base64 string (no data: prefix) so a record
   containing photos can travel inside ordinary JSON. Async because
   reading a Blob's bytes always is, even though the encode step itself
   is sync once the bytes are in hand. */
function sbBlobToB64(blob){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var result = reader.result || '';
      var comma = result.indexOf(',');
      resolve(comma>-1 ? result.slice(comma+1) : result);
    };
    reader.onerror = function(){ reject(reader.error); };
    reader.readAsDataURL(blob);
  });
}
function sbB64ToBlob(b64, type){
  var bin = atob(b64);
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++){ arr[i] = bin.charCodeAt(i); }
  return new Blob([arr], {type: type || 'image/jpeg'});
}
/* Deep-walks a record looking for Blob values (a photo's .blob field, a
   vessel photo, anything nested inside customFindings[].photos[], etc.)
   and replaces each with a small JSON-safe marker carrying its base64
   bytes and mime type. Walking generically like this, rather than
   hard-coding "photos" and "customFindings" paths, means a new field
   added to the app later that happens to hold a Blob is still handled
   correctly here without this function needing to change too. */
function sbPackForSync(value){
  if(value instanceof Blob){
    return sbBlobToB64(value).then(function(b64){
      return {__sbBlob:true, b64:b64, type:value.type||'image/jpeg'};
    });
  }
  if(Array.isArray(value)){
    return Promise.all(value.map(sbPackForSync));
  }
  if(value && typeof value==='object'){
    var keys = Object.keys(value);
    var out = {};
    var chain = Promise.resolve();
    keys.forEach(function(k){
      chain = chain.then(function(){
        return sbPackForSync(value[k]).then(function(packed){ out[k] = packed; });
      });
    });
    return chain.then(function(){ return out; });
  }
  return Promise.resolve(value===undefined ? null : value);
}
function sbUnpackFromSync(value){
  if(value && typeof value==='object'){
    if(Array.isArray(value)) return value.map(sbUnpackFromSync);
    if(value.__sbBlob) return sbB64ToBlob(value.b64, value.type);
    var out = {};
    Object.keys(value).forEach(function(k){ out[k] = sbUnpackFromSync(value[k]); });
    return out;
  }
  return value;
}

function sbLocalKey(storeName, value){
  return storeName==='responses' || storeName==='sectionExtras' || storeName==='appConfig' ? value.key : value.id;
}

/* A short debounce so taking five photos in a row triggers one sync
   round, not five — mirrors the existing markDirty/pushDirtyNow pattern
   above for the same reason. */
var sbDirtyQueue = {};
var sbPushTimer = null;
function sbMarkDirty(storeName, localKey){
  if(!sb || !sbUser || !localKey) return;
  sbDirtyQueue[storeName+'|'+localKey] = true;
  if(sbPushTimer) clearTimeout(sbPushTimer);
  sbPushTimer = setTimeout(sbPushDirty, 800);
}
function sbMarkDeleted(storeName, localKey){
  if(!sb || !sbUser || !localKey) return Promise.resolve();
  return sb.from('records').upsert({
    user_id: sbUser.id, store: storeName, key: localKey,
    data: {}, updated_at: Date.now(), deleted: true
  }, {onConflict:'user_id,store,key'}).catch(function(){});
}
function sbPushDirty(){
  if(!sb || !sbUser) return;
  var items = Object.keys(sbDirtyQueue);
  sbDirtyQueue = {};
  if(!items.length) return;
  sbSyncState.status = 'syncing';
  renderSyncStatus();
  var chain = Promise.resolve();
  items.forEach(function(item){
    var sep = item.indexOf('|');
    var storeName = item.slice(0,sep), localKey = item.slice(sep+1);
    chain = chain.then(function(){
      return idbGet(storeName, localKey).catch(function(){ return null; }).then(function(rec){
        if(!rec) return; // deleted locally since being queued; nothing to push
        return sbPackForSync(rec).then(function(packed){
          return sb.from('records').upsert({
            user_id: sbUser.id, store: storeName, key: localKey,
            data: packed, updated_at: rec.updatedAt || Date.now(), deleted: false
          }, {onConflict:'user_id,store,key'});
        });
      }).catch(function(){
        sbDirtyQueue[item] = true; // re-queue for the next retry
      });
    });
  });
  chain.then(function(){
    sbSyncState.status = Object.keys(sbDirtyQueue).length ? 'error' : 'idle';
    sbSyncState.lastSyncedAt = Date.now();
    renderSyncStatus();
  });
}
/* Pulls every row for this login and writes anything newer than the
   local copy straight in with idbPutRaw — not idbPut — so pulling a
   change down doesn't turn around and re-queue it as a local edit to
   push straight back up. */
function sbPullAll(){
  if(!sb || !sbUser) return Promise.resolve();
  sbSyncState.status = 'syncing';
  renderSyncStatus();
  return sb.from('records').select('*').eq('user_id', sbUser.id).then(function(res){
    if(res.error || !res.data){ sbSyncState.status='error'; sbSyncState.error=res.error; renderSyncStatus(); return; }
    var chain = Promise.resolve();
    res.data.forEach(function(row){
      chain = chain.then(function(){
        return idbGet(row.store, row.key).catch(function(){ return null; }).then(function(local){
          if(row.deleted){
            if(local) return idbDelete(row.store, row.key).catch(function(){});
            return;
          }
          if(local && (local.updatedAt||0) >= (row.updated_at||0)) return; // local is already current
          var unpacked = sbUnpackFromSync(row.data);
          return idbPutRaw(row.store, unpacked).catch(function(){});
        });
      });
    });
    return chain.then(function(){
      // A pulled row can include another device's checklist-template edit
      // (store 'appConfig'), so refresh the in-memory SECTIONS from what's
      // now on disk before deciding whether to re-render.
      return loadSectionsTemplate();
    }).then(function(){
      sbSyncState.status = 'idle';
      sbSyncState.lastSyncedAt = Date.now();
      renderSyncStatus();
      if(['home','sections','section','report','manageChecklist','manageChecklistSection'].indexOf(state.view)>-1) render();
    });
  }).catch(function(err){
    sbSyncState.status = 'error'; sbSyncState.error = err;
    renderSyncStatus();
  });
}

/* Runs once right after a successful sign-in or sign-up, AFTER sbPullAll
   has already brought in anything newer from the cloud. Without this,
   a device's data that existed BEFORE its very first sign-in on this
   login would sit in its IndexedDB forever and never reach the shared
   cloud copy: going-forward edits get pushed by idbPut's dirty-marking
   hook (see sbMarkDirty calls there), but a record that predates that
   hook ever running for this login has no other path to get pushed.
   This is exactly the gap that let the phone and laptop each keep their
   own separate pre-existing inspections after signing into the same
   account — this closes it by comparing every local record's updatedAt
   against a lightweight index of what the cloud already has, and
   queuing (via the existing sbMarkDirty/sbPushDirty pipeline) anything
   local that's missing from the cloud or newer than the cloud's copy.
   Deletions are respected the same way: a cloud tombstone is just a row
   with a deleted flag and its own updated_at, so a local record only
   overrides it if the local edit is genuinely newer. */
function sbPushLocalBacklog(){
  if(!sb || !sbUser) return Promise.resolve();
  return sb.from('records').select('store,key,updated_at,deleted').eq('user_id', sbUser.id).then(function(res){
    var cloudIndex = {};
    if(res.data){
      res.data.forEach(function(row){ cloudIndex[row.store+'|'+row.key] = row; });
    }
    var chain = Promise.resolve();
    SB_STORES.forEach(function(storeName){
      chain = chain.then(function(){
        return idbGetAll(storeName).then(function(records){
          (records||[]).forEach(function(rec){
            var key = sbLocalKey(storeName, rec);
            if(!key) return;
            var cloudRow = cloudIndex[storeName+'|'+key];
            var localUpdated = rec.updatedAt||0;
            if(!cloudRow || (cloudRow.updated_at||0) < localUpdated){
              sbMarkDirty(storeName, key);
            }
          });
        }).catch(function(){});
      });
    });
    return chain;
  }).catch(function(){});
}

/* Re-resolves currentRole for whoever sbUser now is (or 'unassigned' if
   nobody), then does the usual sync-status render. Every place below that
   sets sbUser calls this instead of renderSyncStatus() directly — without
   it, currentRole would keep pointing at whoever was signed in before,
   which is exactly the bug this was built to close (everyone silently
   staying/becoming Admin regardless of sign-in state). */
function refreshRoleAndSync(){
  return initUserRole().then(function(){ renderSyncStatus(); });
}
function sbSignIn(email, password){
  sbSyncState.authBusy = true; sbSyncState.authError = null; renderSyncStatus();
  return sb.auth.signInWithPassword({email:email, password:password}).then(function(res){
    sbSyncState.authBusy = false;
    if(res.error){ sbSyncState.authError = res.error.message; renderSyncStatus(); return; }
    sbUser = res.data.user;
    return refreshRoleAndSync().then(function(){
      return sbPullAll().then(function(){ return sbPushLocalBacklog(); });
    });
  });
}
function sbSignUp(email, password){
  sbSyncState.authBusy = true; sbSyncState.authError = null; renderSyncStatus();
  return sb.auth.signUp({email:email, password:password}).then(function(res){
    sbSyncState.authBusy = false;
    if(res.error){ sbSyncState.authError = res.error.message; renderSyncStatus(); return; }
    sbUser = res.data.user;
    return refreshRoleAndSync().then(function(){
      if(sbUser) return sbPullAll().then(function(){ return sbPushLocalBacklog(); });
    });
  });
}
/* Forgets the session locally no matter what — even when the network
   call to revoke it server-side fails or hangs (e.g. this network blocks
   Supabase entirely, as with the office Wi-Fi's DNS filtering). Staying
   signed in against the person's wishes just because a request to tell
   the server about it didn't get through would be a worse failure than
   the sign-out being "incomplete" server-side; the session token still
   expires on its own eventually either way. */
function sbSignOut(){
  function forget(){
    sbUser = null;
    refreshRoleAndSync();
  }
  return sb.auth.signOut().then(forget).catch(forget);
}
function sbInitAuth(){
  if(!sb) return;
  sb.auth.onAuthStateChange(function(event, session){
    sbUser = session ? session.user : null;
    refreshRoleAndSync();
  });
  sb.auth.getSession().then(function(res){
    sbUser = (res.data && res.data.session) ? res.data.session.user : null;
    refreshRoleAndSync().then(function(){
      /* Also reconciles any pre-existing local backlog on ordinary app
         open (not just a fresh sign-in), so a device that was already
         signed in before this backlog fix existed picks it up the next
         time it's opened, without needing to sign out and back in. */
      if(sbUser) sbPullAll().then(function(){ return sbPushLocalBacklog(); });
    });
  }).catch(function(){});
  if(typeof window!=='undefined'){
    window.addEventListener('online', function(){ sbPushDirty(); sbPullAll(); });
  }
}
/* Re-renders just the sync bar in place when possible, so a status
   change (e.g. "Syncing…" to "Synced just now") doesn't interrupt
   whatever the person is doing elsewhere on the home screen. Falls back
   to a full render if the bar isn't there to find (rare — only right
   after first navigating to the home screen, before its first paint).
   Whenever the login gate should be showing or should stop showing
   (sign-in just succeeded, sign-out just happened, a cached session was
   just found at startup), this always does a FULL render instead — the
   in-place patch only ever touches the small sync bar itself, and that
   would leave a stale, fully-populated home screen sitting behind it
   (or a stale gate lingering after signing in), exactly what the gate
   exists to prevent. */
var sbGateWasActive = false;
function renderSyncStatus(){
  var gateNow = sbAuthGateActive();
  if(gateNow || sbGateWasActive){
    // Either the gate should be showing right now, or it just stopped
    // being needed (a sign-in/sign-up just succeeded). Both are always a
    // full render, even when state.view is left over from whatever
    // screen was showing before the person got signed out — any screen
    // that isn't right for the new role bounces itself back to Home via
    // its own guardAdminOnly()/guardVesselAccess() check, same as
    // navigating there directly would. Without this, a sign-in whose
    // leftover view wasn't already 'home' left the gate stuck on screen
    // even though sbUser (and currentRole) had actually moved on.
    sbGateWasActive = gateNow;
    render();
    return;
  }
  sbGateWasActive = gateNow;
  var el = document.querySelector('.sync-bar');
  if(el && state.view==='home'){
    var parent = el.parentNode;
    var tmp = document.createElement('div');
    tmp.innerHTML = syncStatusBarHTML();
    var fresh = tmp.firstElementChild;
    if(fresh){ parent.replaceChild(fresh, el); wireSyncBar(); }
  } else if(state.view==='home'){
    render();
  }
}

/* =====================================================================
   ACCESS CONTROL — four roles on top of the shared data:
     admin          full control of everything (vessels, inspections, roles)
     director       sees every vessel and every report; changes nothing
     techManager    full control, but only over their OWN assigned fleet
     vesselManager  same as techManager, but scoped to just the one or
                     two vessels an admin assigned them (no vessel-list
                     management screen of their own — same as techManager)
   IMPORTANT LIMITATION, stated plainly: this is enforced by this page's
   own screens, not by the underlying data store. On the real deployment
   (GitHub Pages + Supabase), row-level security policies on the
   user_roles table itself are the actual security boundary — see the
   setup SQL shipped alongside this file — but every other shared table
   (inspections, vessels, etc.) is still readable/writable by any signed-in
   user, same as before this feature existed. Treat role as a workflow
   guardrail for the team, not a lock against a malicious insider.
   BOOTSTRAP_ADMIN_EMAIL always resolves to admin, independent of
   anything stored in user_roles, so there is always at least one person
   who can open "Manage users" and hand out the other roles — including
   on a freshly copied project where user_roles is empty or doesn't
   exist yet.
   ===================================================================== */
var BOOTSTRAP_ADMIN_EMAIL = 'pavan.trivedi96@gmail.com';
var currentRole = {type:'admin', fleet:null, userId:null, name:''};
function initUserRole(){
  // Artifact-hosted runtime (Claude's own window.claude capabilities) —
  // a separate, older role store from the Supabase one below. Only ever
  // active when this page is opened as a published Claude artifact with
  // the user + db capabilities granted; inert (cloudUser stays null) on
  // the real GitHub Pages deployment, which falls through to Supabase.
  if(cloudUser){
    return cloudUser.me().then(function(viewer){
      if(viewer.isOwner){
        currentRole = {type:'admin', fleet:null, userId:viewer.id, name:viewer.name};
        return currentRole;
      }
      if(!syncEnabled){
        // No shared store to hold roles in — behave exactly as before this
        // feature existed rather than locking a local/offline session out.
        currentRole = {type:'admin', fleet:null, userId:viewer.id, name:viewer.name};
        return currentRole;
      }
      if(!viewer.id){
        currentRole = {type:'unassigned', fleet:[], userId:null, name:viewer.name};
        return currentRole;
      }
      return cloudDb.doc('user_roles/'+viewer.id).get().then(function(snap){
        var data = snap.exists ? (snap.data()||{}) : {};
        currentRole = {type:data.role||'unassigned', fleet:data.fleet||[], userId:viewer.id, name:viewer.name};
        return currentRole;
      }).catch(function(){
        currentRole = {type:'unassigned', fleet:[], userId:viewer.id, name:viewer.name};
        return currentRole;
      });
    }).catch(function(){
      currentRole = {type:'admin', fleet:null, userId:null, name:''};
      return currentRole;
    });
  }

  // Real deployment: role lives in Supabase's user_roles table, keyed by
  // the signed-in person's email (see the setup SQL for the table + RLS
  // policies). Re-run this any time sbUser changes (sbSignIn/sbSignUp/
  // sbSignOut/sbInitAuth all do, via refreshRoleAndSync below) — it is
  // NOT automatically kept in sync otherwise.
  if(!sb){
    // No backend configured at all (a bare saved copy of this file with
    // no Supabase script tag) — behave exactly as before this feature
    // existed rather than locking a local/offline session out.
    currentRole = {type:'admin', fleet:null, userId:null, name:''};
    return Promise.resolve(currentRole);
  }
  var email = ((sbUser && sbUser.email) || '').trim().toLowerCase();
  if(!email){
    // Not signed in (yet) — the login gate normally covers this, but
    // keep a safe, access-nothing default in case it doesn't.
    currentRole = {type:'unassigned', fleet:[], userId:null, name:''};
    return Promise.resolve(currentRole);
  }
  if(email===BOOTSTRAP_ADMIN_EMAIL){
    currentRole = {type:'admin', fleet:null, userId:sbUser.id, name:currentRole.name||''};
    return Promise.resolve(currentRole);
  }
  return sb.from('user_roles').select('*').eq('email', email).maybeSingle().then(function(res){
    if(res.error || !res.data){
      currentRole = {type:'unassigned', fleet:[], userId:sbUser.id, name:''};
      return currentRole;
    }
    var data = res.data;
    currentRole = {type:data.role||'unassigned', fleet:data.fleet||[], userId:sbUser.id, name:data.name||''};
    return currentRole;
  }).catch(function(){
    currentRole = {type:'unassigned', fleet:[], userId:sbUser.id, name:''};
    return currentRole;
  });
}
function effectiveRole(){ return currentRole; }
function isAdminRole(){ return effectiveRole().type==='admin'; }
function isDirectorRole(){ return effectiveRole().type==='director'; }
function isTechManagerRole(){ return effectiveRole().type==='techManager'; }
function isVesselManagerRole(){ return effectiveRole().type==='vesselManager'; }
function isUnassignedRole(){ return effectiveRole().type==='unassigned'; }
/* True for admin/director (see everything) and for a tech manager or
   vessel manager whose fleet includes this vessel name; false only
   narrows their own view down to their assigned ship(s). A tech manager's
   fleet is usually several vessels, a vessel manager's usually just one
   or two, but both are stored and checked the same way. */
function vesselAllowedForRole(vesselName){
  var t = effectiveRole().type;
  if(t!=='techManager' && t!=='vesselManager') return true;
  var n = (vesselName||'').trim().toLowerCase();
  return (effectiveRole().fleet||[]).some(function(f){ return (f||'').trim().toLowerCase()===n; });
}
/* Bounces away from a screen this role shouldn't reach and lets the
   caller return a placeholder — navigate() triggers its own render
   immediately after, so the placeholder is on screen only briefly. */
function guardVesselAccess(vesselName){
  var t = effectiveRole().type;
  if((t==='techManager' || t==='vesselManager') && !vesselAllowedForRole(vesselName)){
    toast("You don't have access to that vessel");
    navigate('home');
    return false;
  }
  return true;
}
function guardAdminOnly(){
  if(!isAdminRole()){
    toast('Admin access required');
    navigate('home');
    return false;
  }
  return true;
}
function updateSyncStatusUI(){
  var textEl = document.getElementById('syncStatusText');
  var dotEl = textEl && textEl.parentElement ? textEl.parentElement.querySelector('.sync-dot') : null;
  if(!textEl) return; // Home isn't the active view right now; it'll render fresh next time
  var dotClass = 'idle', label;
  if(syncState.status==='syncing'){ dotClass='syncing'; label='Syncing…'; }
  else if(syncState.status==='error'){ dotClass='error'; label='Sync error — will retry'; }
  else if(typeof navigator!=='undefined' && navigator.onLine===false){ dotClass='idle'; label='Offline — will sync when back online'; }
  else if(syncState.lastSyncedAt){ dotClass='synced'; label='Synced '+relativeTime(syncState.lastSyncedAt); }
  else { dotClass='idle'; label='Ready to sync'; }
  textEl.textContent = label;
  if(dotEl) dotEl.className = 'sync-dot '+dotClass;
}

function markDirty(inspectionId){
  if(!syncEnabled || !inspectionId) return;
  dirtyInspections[inspectionId] = true;
  scheduleDirtyPush();
}
/* The actual push logic, pulled out of the debounce wrapper below so it can
   also be called immediately (bypassing the 1.5s debounce delay) the moment
   the page is backgrounded or closed — see the visibilitychange/pagehide
   listeners further down. Without that, an answer ticked right before
   switching apps or locking the phone could sit dirty for the full debounce
   window and never get uploaded before the tab is suspended, which is how
   answered questions can go missing after all: not deleted anywhere, just
   never saved to the cloud in the first place. */
function pushDirtyNow(){
  if(!syncEnabled || syncInProgress) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false) return;
  var ids = Object.keys(dirtyInspections);
  if(!ids.length) return;
  dirtyInspections = {};
  syncInProgress = true;
  syncState.status = 'syncing';
  updateSyncStatusUI();
  var chain = Promise.resolve();
  ids.forEach(function(id){
    chain = chain.then(function(){ return pushInspectionToCloud(id); });
  });
  return chain.then(function(){
    syncInProgress = false;
    syncState.status = 'idle';
    syncState.lastSyncedAt = Date.now();
    syncState.error = null;
    updateSyncStatusUI();
  }).catch(function(err){
    syncInProgress = false;
    syncState.status = 'error';
    syncState.error = (err && err.message) || 'Sync failed';
    ids.forEach(function(id){ dirtyInspections[id] = true; }); // retry next trigger
    updateSyncStatusUI();
  });
}
var scheduleDirtyPush = debounce(pushDirtyNow, 1500);
/* Safety net for the debounce window above: as soon as the page is hidden
   (app backgrounded, tab switched, phone locked) or is being torn down,
   flush any pending answers right away instead of waiting for 1.5s of
   further inactivity that may never come before the page is suspended. */
if(typeof document !== 'undefined'){
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) pushDirtyNow();
  });
}
if(typeof window !== 'undefined'){
  window.addEventListener('pagehide', function(){ pushDirtyNow(); });
}

/* Uploads one photo {id, blob, assetId?} if not already uploaded, mutating
   it in place with the resulting assetId. Best-effort: a single photo
   failing to upload does not fail the whole sync. */
function ensurePhotoUploaded(photo){
  if(!photo) return Promise.resolve(null);
  if(photo.assetId) return Promise.resolve(photo.assetId);
  if(!cloudAssets || !photo.blob) return Promise.resolve(null);
  return cloudAssets.upload(photo.blob).then(function(res){
    photo.assetId = res.id;
    return res.id;
  }).catch(function(){ return null; });
}
function uploadPhotosArray(photos){
  photos = photos || [];
  var chain = Promise.resolve();
  photos.forEach(function(p){
    chain = chain.then(function(){ return ensurePhotoUploaded(p); });
  });
  return chain.then(function(){
    return photos.map(function(p){ return p.assetId; }).filter(Boolean);
  });
}
/* A single fetch here used to be the whole story: one failed request
   (a dropped packet, a slow satellite/ship-wifi link timing out) and the
   photo was simply gone, indistinguishable from "this asset doesn't
   exist". A phone on a weaker or less stable connection than a laptop's
   hits that far more often, which is exactly the asymmetry behind photos
   syncing down fine on one device and not another. A few retries with a
   short pause between them costs nothing when the network is fine and
   turns most transient failures into successes. */
function fetchAssetAsBlob(assetId, attemptsLeft){
  if(attemptsLeft==null) attemptsLeft = 3;
  return fetch('/_blob/'+assetId).then(function(res){
    if(!res.ok) throw new Error('bad status '+res.status);
    return res.blob();
  }).catch(function(err){
    if(attemptsLeft>1){
      return new Promise(function(resolve){ setTimeout(resolve, 800); })
        .then(function(){ return fetchAssetAsBlob(assetId, attemptsLeft-1); });
    }
    return null;
  });
}
function resolvePhotosFromAssetIds(assetIds){
  assetIds = assetIds || [];
  var chain = Promise.resolve();
  var out = [];
  assetIds.forEach(function(assetId){
    chain = chain.then(function(){
      return fetchAssetAsBlob(assetId).then(function(blob){
        if(blob) out.push({id: uid(), assetId: assetId, blob: blob});
      });
    });
  });
  return chain.then(function(){ return out; });
}
/* Used when pulling: for each assetId the cloud says this record should
   have, reuse the existing local photo if this device already has one
   with that assetId (the overwhelmingly common case — a photo added on
   this same device was already uploaded and is sitting right here) rather
   than re-fetching it. This means a pull can never silently drop a photo
   this device already has just because one fetch had a hiccup; only a
   genuinely new photo from another device needs a successful fetch. */
function resolvePhotosFromAssetIdsMerged(assetIds, existingLocalPhotos){
  assetIds = assetIds || [];
  var localByAssetId = {};
  var unsyncedLocal = [];
  (existingLocalPhotos||[]).forEach(function(p){
    if(!p) return;
    if(p.assetId) localByAssetId[p.assetId] = p;
    /* No assetId means this photo hasn't finished uploading yet — the
       cloud's photoAssetIds list can't possibly mention it, since it was
       never in a position to. That's a fact about upload timing, not
       evidence the photo should be removed, so it's always kept. */
    else unsyncedLocal.push(p);
  });
  var chain = Promise.resolve();
  var out = [];
  assetIds.forEach(function(assetId){
    chain = chain.then(function(){
      if(localByAssetId[assetId]){ out.push(localByAssetId[assetId]); return; }
      return fetchAssetAsBlob(assetId).then(function(blob){
        if(blob) out.push({id: uid(), assetId: assetId, blob: blob});
      });
    });
  });
  return chain.then(function(){ return out.concat(unsyncedLocal); });
}

/* Pushes one inspection's full current local state to the cloud: two
   documents (metadata + bulk data), uploading any not-yet-uploaded
   photos to assets first and persisting the resulting assetIds locally
   so they are never re-uploaded on a later sync. */
function pushInspectionToCloud(inspectionId){
  if(!syncEnabled) return Promise.resolve();
  var insp;
  return idbGet('inspections', inspectionId).then(function(i){
    insp = i;
    if(!insp) return null;
    return Promise.all([
      idbGetAllByIndex('responses','byInspection', inspectionId),
      idbGetAllByIndex('sectionExtras','byInspection', inspectionId),
      getCustomSections(inspectionId)
    ]);
  }).then(function(results){
    if(!insp || !results) return;
    var responses = results[0], extrasList = results[1], customSectionsList = results[2];
    var vesselPhotoAssetId = null;
    var uploadChain = Promise.resolve();

    if(insp.vesselPhoto && insp.vesselPhoto.blob){
      uploadChain = uploadChain.then(function(){
        return ensurePhotoUploaded(insp.vesselPhoto).then(function(assetId){
          vesselPhotoAssetId = assetId;
          if(assetId) return idbPutRaw('inspections', insp);
        });
      });
    } else if(insp.vesselPhoto && insp.vesselPhoto.assetId){
      vesselPhotoAssetId = insp.vesselPhoto.assetId;
    }

    responses.forEach(function(r){
      uploadChain = uploadChain.then(function(){
        return uploadPhotosArray(r.photos).then(function(){ return idbPutRaw('responses', r); });
      });
    });
    extrasList.forEach(function(ex){
      uploadChain = uploadChain.then(function(){
        var innerChain = uploadPhotosArray(ex.photos);
        (ex.customFindings||[]).forEach(function(cf){
          innerChain = innerChain.then(function(){ return uploadPhotosArray(cf.photos); });
        });
        return innerChain.then(function(){ return idbPutRaw('sectionExtras', ex); });
      });
    });

    return uploadChain.then(function(){
      var respOut = responses.map(function(r){
        return {
          sectionSr:r.sectionSr, qIdx:r.qIdx, ref:r.ref,
          applicable:r.applicable, answer:r.answer, remarks:r.remarks||'',
          correctiveAction:r.correctiveAction||'', preventiveAction:r.preventiveAction||'',
          photoAssetIds: (r.photos||[]).map(function(p){ return p.assetId; }).filter(Boolean)
        };
      });
      var extrasOut = extrasList.map(function(ex){
        return {
          sectionSr: ex.sectionSr,
          photoAssetIds: (ex.photos||[]).map(function(p){ return p.assetId; }).filter(Boolean),
          customFindings: (ex.customFindings||[]).map(function(cf){
            return {
              id:cf.id, text:cf.text||'', answer:cf.answer||null,
              correctiveAction:cf.correctiveAction||'', preventiveAction:cf.preventiveAction||'',
              photoAssetIds: (cf.photos||[]).map(function(p){ return p.assetId; }).filter(Boolean)
            };
          })
        };
      });
      var customOut = customSectionsList.map(function(cs){ return {id:cs.id, name:cs.name}; });

      var metaDoc = {
        vesselName: insp.vesselName||'', imo: insp.imo||'', vesselType: insp.vesselType||'',
        port: insp.port||'', date: insp.date||'', inspector: insp.inspector||'', company: insp.company||'',
        summary: insp.summary||'', conclusion: insp.conclusion||'', status: insp.status||'in_progress',
        vesselPhotoAssetId: vesselPhotoAssetId,
        inspectionType: insp.inspectionType||'port', completionDate: insp.completionDate||'',
        sailFromDate: insp.sailFromDate||'', sailFromPort: insp.sailFromPort||'',
        sailToDate: insp.sailToDate||'', sailToPort: insp.sailToPort||'',
        remoteFromDate: insp.remoteFromDate||'', remoteToDate: insp.remoteToDate||'',
        createdAt: insp.createdAt||Date.now(), updatedAt: insp.updatedAt||Date.now()
      };
      var dataDoc = {
        responses: respOut, sectionExtras: extrasOut, customSections: customOut,
        updatedAt: insp.updatedAt||Date.now()
      };
      return Promise.all([
        cloudDb.doc('inspections/'+inspectionId).set(metaDoc),
        cloudDb.doc('inspection_data/'+inspectionId).set(dataDoc)
      ]);
    });
  });
}

/* Pulls one inspection down from the cloud into local IndexedDB,
   downloading any referenced photos from assets and rebuilding the same
   local record shapes used everywhere else in the app. */
function pullInspectionFromCloud(id, cloudMeta){
  return Promise.all([
    cloudDb.doc('inspection_data/'+id).get(),
    idbGet('inspections', id).catch(function(){ return null; })
  ]).then(function(results){
    var dataSnap = results[0], existingInsp = results[1];
    var data = dataSnap.exists ? (dataSnap.data()||{}) : {};
    var vesselPhotoPromise = Promise.resolve(null);
    if(cloudMeta.vesselPhotoAssetId){
      if(existingInsp && existingInsp.vesselPhoto && existingInsp.vesselPhoto.assetId===cloudMeta.vesselPhotoAssetId){
        vesselPhotoPromise = Promise.resolve(existingInsp.vesselPhoto);
      } else {
        vesselPhotoPromise = fetchAssetAsBlob(cloudMeta.vesselPhotoAssetId).then(function(blob){
          return blob ? {id: uid(), assetId: cloudMeta.vesselPhotoAssetId, blob: blob} : (existingInsp ? existingInsp.vesselPhoto : null);
        });
      }
    } else if(existingInsp && existingInsp.vesselPhoto && !existingInsp.vesselPhoto.assetId){
      /* Local has an unsynced (not-yet-uploaded) photo the cloud doesn't
         know about yet — keep it rather than wiping it to null. */
      vesselPhotoPromise = Promise.resolve(existingInsp.vesselPhoto);
    }
    return vesselPhotoPromise.then(function(vesselPhoto){
      var insp = {
        id: id,
        vesselName: cloudMeta.vesselName||'', imo: cloudMeta.imo||'', vesselType: cloudMeta.vesselType||'',
        port: cloudMeta.port||'', date: cloudMeta.date||todayISO(), inspector: cloudMeta.inspector||'',
        company: cloudMeta.company||'', summary: cloudMeta.summary||'', conclusion: cloudMeta.conclusion||'',
        status: cloudMeta.status||'in_progress', vesselPhoto: vesselPhoto,
        inspectionType: cloudMeta.inspectionType||'port', completionDate: cloudMeta.completionDate||'',
        sailFromDate: cloudMeta.sailFromDate||'', sailFromPort: cloudMeta.sailFromPort||'',
        sailToDate: cloudMeta.sailToDate||'', sailToPort: cloudMeta.sailToPort||'',
        remoteFromDate: cloudMeta.remoteFromDate||'', remoteToDate: cloudMeta.remoteToDate||'',
        createdAt: cloudMeta.createdAt||Date.now(), updatedAt: cloudMeta.updatedAt||Date.now()
      };
      return idbPutRaw('inspections', insp).then(function(){
        var chain = Promise.resolve();
        (data.responses||[]).forEach(function(r){
          chain = chain.then(function(){
            var key = responseKey(id, r.sectionSr, r.qIdx);
            return idbGet('responses', key).catch(function(){ return null; }).then(function(existing){
              return resolvePhotosFromAssetIdsMerged(r.photoAssetIds, existing && existing.photos).then(function(photos){
                return idbPutRaw('responses', {
                  key: key, inspectionId: id,
                  sectionSr:r.sectionSr, qIdx:r.qIdx, ref:r.ref,
                  applicable:r.applicable, answer:r.answer, remarks:r.remarks||'',
                  correctiveAction:r.correctiveAction||'', preventiveAction:r.preventiveAction||'',
                  photos: photos, updatedAt: Date.now()
                });
              });
            });
          });
        });
        (data.sectionExtras||[]).forEach(function(ex){
          chain = chain.then(function(){
            var key = extrasKey(id, ex.sectionSr);
            return idbGet('sectionExtras', key).catch(function(){ return null; }).then(function(existingExtras){
              var existingCfById = {};
              (existingExtras && existingExtras.customFindings || []).forEach(function(cf){ existingCfById[cf.id] = cf; });
              return resolvePhotosFromAssetIdsMerged(ex.photoAssetIds, existingExtras && existingExtras.photos).then(function(genPhotos){
                var cfChain = Promise.resolve();
                var cfOut = [];
                (ex.customFindings||[]).forEach(function(cf){
                  cfChain = cfChain.then(function(){
                    var existingCf = existingCfById[cf.id];
                    return resolvePhotosFromAssetIdsMerged(cf.photoAssetIds, existingCf && existingCf.photos).then(function(cfPhotos){
                      cfOut.push({
                        id:cf.id, text:cf.text||'', answer:cf.answer||null,
                        correctiveAction:cf.correctiveAction||'', preventiveAction:cf.preventiveAction||'',
                        photos:cfPhotos
                      });
                    });
                  });
                });
                return cfChain.then(function(){
                  return idbPutRaw('sectionExtras', {
                    key: key, inspectionId: id, sectionSr: ex.sectionSr,
                    photos: genPhotos, customFindings: cfOut, updatedAt: Date.now()
                  });
                });
              });
            });
          });
        });
        (data.customSections||[]).forEach(function(cs){
          chain = chain.then(function(){
            return idbPutRaw('customSections', {id:cs.id, inspectionId:id, name:cs.name, createdAt:Date.now(), updatedAt:Date.now()});
          });
        });
        return chain;
      });
    });
  });
}

function reconcileInspection(cloudId, cloudMeta){
  return idbGet('inspections', cloudId).then(function(localInsp){
    var cloudUpdatedAt = cloudMeta.updatedAt || 0;
    if(!localInsp){
      return pullInspectionFromCloud(cloudId, cloudMeta).then(function(){
        return repairMissingPhotos(cloudId, cloudMeta);
      });
    }
    var localUpdatedAt = localInsp.updatedAt || 0;
    if(localUpdatedAt > cloudUpdatedAt) return pushInspectionToCloud(cloudId);
    if(cloudUpdatedAt > localUpdatedAt){
      return pullInspectionFromCloud(cloudId, cloudMeta).then(function(){
        return repairMissingPhotos(cloudId, cloudMeta);
      });
    }
    // Timestamps already match, so the normal pull/push logic above has
    // nothing to do — but that only means nothing has changed since last
    // time, not that last time actually got every photo. See
    // repairMissingPhotos for why a gap can persist silently through
    // any number of these otherwise-uneventful reconciles.
    return repairMissingPhotos(cloudId, cloudMeta);
  });
}

/* Same newer-wins comparison as reconcileInspection, simplified: a vessel
   record has no photos or sub-collections to repair, just the three
   fields themselves. */
function reconcileOneVessel(cloudId, cloudMeta){
  function extraFields(){
    var out = {};
    VESSEL_EXTRA_FIELDS.forEach(function(f){ out[f.key] = cloudMeta[f.key]||''; });
    return out;
  }
  return idbGet('vessels', cloudId).then(function(localV){
    var cloudUpdatedAt = cloudMeta.updatedAt || 0;
    if(!localV){
      return idbPutRaw('vessels', Object.assign({
        id: cloudId, name: cloudMeta.name||'', imo: cloudMeta.imo||'', vesselType: cloudMeta.vesselType||'',
        createdAt: cloudMeta.createdAt||cloudUpdatedAt||Date.now(), updatedAt: cloudUpdatedAt||Date.now()
      }, extraFields()));
    }
    var localUpdatedAt = localV.updatedAt || 0;
    if(localUpdatedAt > cloudUpdatedAt) return pushVesselToCloud(localV);
    if(cloudUpdatedAt > localUpdatedAt){
      return idbPutRaw('vessels', Object.assign({
        id: cloudId, name: cloudMeta.name||'', imo: cloudMeta.imo||'', vesselType: cloudMeta.vesselType||'',
        createdAt: cloudMeta.createdAt||localV.createdAt||Date.now(), updatedAt: cloudUpdatedAt
      }, extraFields()));
    }
    return Promise.resolve();
  });
}
/* Two-way reconcile for the vessel master list, same shape as the
   inspections block in fullReconcile below: apply tombstones (from either
   side), pull/push per-record by whichever side is newer, then push any
   local vessel the cloud doesn't have yet. Called from fullReconcile so
   one sync pass covers both inspections and the vessel list. Best-effort
   throughout — a vessel-sync hiccup should never surface as a sync error
   for the rest of the app. */
function reconcileVessels(){
  if(!syncEnabled) return Promise.resolve();
  var deletedIds = {};
  return idbGetAll('deletedVessels').then(function(localTombstones){
    (localTombstones||[]).forEach(function(t){ deletedIds[t.id] = true; });
    var pushTombChain = Promise.resolve();
    (localTombstones||[]).forEach(function(t){
      pushTombChain = pushTombChain.then(function(){ return pushVesselTombstoneToCloud(t.id); });
    });
    return pushTombChain;
  }).then(function(){
    return cloudDb.collection('deleted_vessels').get();
  }).then(function(tombSnap){
    (tombSnap.docs||[]).forEach(function(docSnap){
      if(docSnap.exists) deletedIds[docSnap.id] = true;
    });
    return cloudDb.collection('vessels').get();
  }).then(function(snap){
    var cloudIds = {};
    var chain = Promise.resolve();
    (snap.docs||[]).forEach(function(docSnap){
      if(!docSnap.exists) return;
      var id = docSnap.id;
      if(deletedIds[id]){
        chain = chain.then(function(){ return pushVesselTombstoneToCloud(id); });
        return;
      }
      cloudIds[id] = true;
      var meta = docSnap.data() || {};
      chain = chain.then(function(){ return reconcileOneVessel(id, meta); });
    });
    return chain.then(function(){ return getVessels(); }).then(function(localList){
      var pushChain = Promise.resolve();
      localList.forEach(function(v){
        if(deletedIds[v.id]){
          pushChain = pushChain.then(function(){
            return idbPutRaw('deletedVessels', {id:v.id, deletedAt:Date.now()}).then(function(){
              return idbDelete('vessels', v.id);
            });
          });
          return;
        }
        if(!cloudIds[v.id]){
          pushChain = pushChain.then(function(){ return pushVesselToCloud(v); });
        }
      });
      return pushChain;
    });
  }).catch(function(){});
}

/* fetchAssetAsBlob is best-effort (now with retries, but a bad enough
   connection can still exhaust them), and its failure looks identical to
   "this photo doesn't exist" to everything downstream — including
   pullInspectionFromCloud, which will happily store an inspection with a
   gap where a photo should be. Because that gap doesn't change the
   inspection's updatedAt, reconcileInspection's normal newer-wins logic
   has no way to notice it on later syncs: the record now claims to be
   fully up to date. This runs after the normal reconcile logic on every
   sync — including ones where nothing else changed — and fills in any
   photo the cloud's data doc says should be attached but isn't present
   locally. Only worth skipping when the local copy is strictly newer than
   the cloud's (the push case in reconcileInspection above), since in that
   case the cloud's own photo list is the stale one.

   An earlier version of this function also opened every already-present
   photo to verify it actually decodes, treating a failure as corruption
   and re-fetching it. That turned out to be chasing a false signal: the
   same untouched photo would flip between "decodes fine" and "fails to
   decode" from one run to the next, seconds apart, on the same device —
   which a real corrupt file cannot do. What was actually happening is
   that the decode check itself (and, it turned out, the plain FileReader
   read used everywhere else) can fail transiently under real memory
   pressure, and a long session that keeps re-fetching and re-decoding the
   same photos over and over is exactly the kind of pressure that
   provokes it. So the check was manufacturing "corruption" out of the
   load it was itself generating, then "fixing" it by re-downloading a
   photo that was never actually broken — pure wasted work, and on a
   loaded device, actively counterproductive. The real fix for transient
   read failures is a retry at the point of reading (see blobToDataURL),
   not a second system re-diagnosing and re-fetching healthy photos. */
function logDiagnostic(tag, info){
  try{
    if(!syncEnabled || !cloudDb) return Promise.resolve();
    var payload = {tag: tag, at: Date.now(), ua: (typeof navigator!=='undefined' ? navigator.userAgent : ''), online: (typeof navigator!=='undefined' ? navigator.onLine : null)};
    for(var k in (info||{})){ payload[k] = info[k]; }
    return cloudDb.doc('diagnostics/'+uid()).set(payload).catch(function(){});
  }catch(e){ return Promise.resolve(); }
}
function repairMissingPhotos(id, cloudMeta){
  if(!syncEnabled || !cloudDb) return Promise.resolve();
  return Promise.all([
    idbGet('inspections', id),
    cloudDb.doc('inspection_data/'+id).get(),
    idbGetAllByIndex('responses','byInspection', id),
    idbGetAllByIndex('sectionExtras','byInspection', id)
  ]).then(function(results){
    var localInsp = results[0], dataSnap = results[1], responses = results[2], extrasList = results[3];
    if(!localInsp) return;
    var data = dataSnap.exists ? (dataSnap.data()||{}) : {};
    var chain = Promise.resolve();

    if(cloudMeta.vesselPhotoAssetId && (!localInsp.vesselPhoto || localInsp.vesselPhoto.assetId!==cloudMeta.vesselPhotoAssetId)){
      chain = chain.then(function(){
        return fetchAssetAsBlob(cloudMeta.vesselPhotoAssetId).then(function(blob){
          if(!blob) return;
          localInsp.vesselPhoto = {id: uid(), assetId: cloudMeta.vesselPhotoAssetId, blob: blob};
          return idbPutRaw('inspections', localInsp);
        });
      });
    }

    /* Fetches any assetId the cloud says should be attached but isn't
       present locally. Deliberately does NOT re-verify photos that are
       already there — see the note above this function for why that
       used to happen and why it was removed. */
    function fillMissingPhotos(assetIds, existingPhotos, onFilled){
      var have = {};
      (existingPhotos||[]).forEach(function(p){ if(p.assetId) have[p.assetId] = true; });
      var missingIds = (assetIds||[]).filter(function(aid){ return !have[aid]; });
      if(!missingIds.length) return Promise.resolve();
      var fetched = [];
      var inner = Promise.resolve();
      missingIds.forEach(function(assetId){
        inner = inner.then(function(){
          return fetchAssetAsBlob(assetId).then(function(blob){
            if(blob) fetched.push({id: uid(), assetId: assetId, blob: blob});
          });
        });
      });
      return inner.then(function(){
        if(!fetched.length) return;
        return onFilled((existingPhotos||[]).concat(fetched));
      });
    }

    var respByKey = {};
    responses.forEach(function(r){ respByKey[responseKey(id, r.sectionSr, r.qIdx)] = r; });
    (data.responses||[]).forEach(function(r){
      var localRec = respByKey[responseKey(id, r.sectionSr, r.qIdx)];
      if(!localRec) return; // a genuinely new response is the normal pull path's job, not a gap
      chain = chain.then(function(){
        return fillMissingPhotos(r.photoAssetIds, localRec.photos, function(updatedPhotos){
          localRec.photos = updatedPhotos;
          return idbPutRaw('responses', localRec);
        });
      });
    });

    var extrasByKey = {};
    extrasList.forEach(function(ex){ extrasByKey[extrasKey(id, ex.sectionSr)] = ex; });
    (data.sectionExtras||[]).forEach(function(ex){
      var localExtras = extrasByKey[extrasKey(id, ex.sectionSr)];
      if(!localExtras) return;
      chain = chain.then(function(){
        return fillMissingPhotos(ex.photoAssetIds, localExtras.photos, function(updatedPhotos){
          localExtras.photos = updatedPhotos;
          return idbPutRaw('sectionExtras', localExtras);
        });
      });
      var cfById = {};
      (localExtras.customFindings||[]).forEach(function(cf){ cfById[cf.id] = cf; });
      (ex.customFindings||[]).forEach(function(cf){
        var localCf = cfById[cf.id];
        if(!localCf) return;
        chain = chain.then(function(){
          return fillMissingPhotos(cf.photoAssetIds, localCf.photos, function(updatedPhotos){
            localCf.photos = updatedPhotos;
            return idbPutRaw('sectionExtras', localExtras); // customFindings live inside the parent extras record
          });
        });
      });
    });

    return chain;
  }).catch(function(){}); // best-effort: a repair failure should never break the rest of sync
}

/* Full two-way reconcile: pulls anything newer in the cloud (including
   inspections that only exist on another device), pushes anything newer
   locally or created locally and never yet synced, and — via the
   tombstone set built up front — makes sure a deletion (from this device
   or any other) is applied everywhere instead of being undone by a pull
   or a push. */
function fullReconcile(){
  if(!syncEnabled || syncInProgress) return Promise.resolve();
  if(typeof navigator!=='undefined' && navigator.onLine===false) return Promise.resolve();
  syncInProgress = true;
  syncState.status = 'syncing';
  updateSyncStatusUI();

  var deletedIds = {}; // ids known deleted, from this device's tombstones or the cloud's

  return idbGetAll('deletedInspections').then(function(localTombstones){
    (localTombstones||[]).forEach(function(t){ deletedIds[t.id] = true; });
    // Retry the cloud side of every local tombstone. Near-instant when it
    // already succeeded (the set/deletes are all no-ops); this is what
    // finishes a deletion that was interrupted by going offline or closing
    // the app right after tapping Delete.
    var pushTombChain = Promise.resolve();
    (localTombstones||[]).forEach(function(t){
      pushTombChain = pushTombChain.then(function(){ return pushTombstoneToCloud(t.id); });
    });
    return pushTombChain;
  }).then(function(){
    return cloudDb.collection('deleted_inspections').get();
  }).then(function(tombSnap){
    (tombSnap.docs||[]).forEach(function(docSnap){
      if(docSnap.exists) deletedIds[docSnap.id] = true;
    });
    return cloudDb.collection('inspections').get();
  }).then(function(snap){
    var cloudIds = {};
    var chain = Promise.resolve();
    (snap.docs||[]).forEach(function(docSnap){
      if(!docSnap.exists) return;
      var id = docSnap.id;
      if(deletedIds[id]){
        // Tombstoned, but the cloud still has a stray copy — the delete
        // that should have removed it never fully landed. Clean it up
        // instead of treating "exists in the cloud, missing locally" as
        // something to pull back down.
        chain = chain.then(function(){ return pushTombstoneToCloud(id); });
        return;
      }
      cloudIds[id] = true;
      var meta = docSnap.data() || {};
      chain = chain.then(function(){ return reconcileInspection(id, meta); });
    });
    return chain.then(function(){ return getInspections(); }).then(function(localList){
      var pushChain = Promise.resolve();
      localList.forEach(function(li){
        if(deletedIds[li.id]){
          // Deleted on another device since this one last synced — apply
          // that deletion here rather than re-uploading our stale copy.
          pushChain = pushChain.then(function(){ return applyRemoteTombstone(li.id); });
          return;
        }
        if(!cloudIds[li.id]){
          pushChain = pushChain.then(function(){ return pushInspectionToCloud(li.id); });
        }
      });
      return pushChain;
    });
  }).then(function(){
    return reconcileVessels();
  }).then(function(){
    syncInProgress = false;
    syncState.status = 'idle';
    syncState.lastSyncedAt = Date.now();
    syncState.error = null;
    updateSyncStatusUI();
  }).catch(function(err){
    syncInProgress = false;
    syncState.status = 'error';
    syncState.error = (err && err.message) || 'Sync failed';
    updateSyncStatusUI();
  });
}

/* Re-uploads every local inspection to the cloud unconditionally, skipping
   the "only if newer" comparison fullReconcile uses. This exists for the
   "Sync now" button specifically: a section that was never touched again
   after an earlier sync bug can be left with a stale, incomplete cloud
   copy (missing photos or fields) that the timestamp-based check alone
   would never revisit, since neither side looks newer than the other.
   Forcing a push re-uploads the complete current local state — the most
   trustworthy copy, since it was never touched by any of those bugs —
   over whatever the cloud currently has, so every device pulls the
   correct data from then on. */
function forcePushAllInspections(){
  if(!syncEnabled) return Promise.resolve();
  return getInspections().then(function(localList){
    var chain = Promise.resolve();
    localList.forEach(function(li){
      chain = chain.then(function(){ return pushInspectionToCloud(li.id); });
    });
    return chain;
  });
}
/* Same forced re-upload as forcePushAllInspections, for the vessel list. */
function forcePushAllVessels(){
  if(!syncEnabled) return Promise.resolve();
  return getVessels().then(function(localList){
    var chain = Promise.resolve();
    localList.forEach(function(v){
      chain = chain.then(function(){ return pushVesselToCloud(v); });
    });
    return chain;
  });
}

if(typeof window !== 'undefined'){
  window.addEventListener('online', function(){
    if(syncEnabled) fullReconcile().then(function(){ if(state.view==='home') render(); });
  });
}

/* =====================================================================
   SERVICE WORKER — required by Chrome/Edge/Android before they'll offer
   "Install app" at all (a manifest alone isn't enough), and it's what
   lets the installed icon reopen successfully with zero connectivity
   (without one, a cold start while offline would fail to load at all,
   even though the app's own data always works offline via IndexedDB).
   Registered from a Blob URL since this is a single self-contained file
   with no separate .js file to point a real <script src> at. Entirely
   best-effort: if service workers aren't supported or registration is
   blocked for any reason, the app already works exactly the same
   without it — this only improves the install prompt and cold-start
   case, never a requirement for normal use.
   ===================================================================== */
function registerServiceWorker(){
  if(typeof navigator==='undefined' || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(function(){});
}

document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('cameraInput').addEventListener('change', handlePhotoFiles);
  document.getElementById('galleryInput').addEventListener('change', handlePhotoFiles);
  registerServiceWorker();
  /* Best-effort: asks the browser to treat this app's storage as
     persistent rather than "best-effort" storage that can be cleared
     under disk-space pressure without warning. Support varies (and some
     browsers grant it silently, some ask the user, some never grant it to
     an artifact-hosted page) so this never blocks startup either way —
     it only lowers the odds of the eviction this app already works
     around elsewhere (see saveAndVerify, hydratePhotoDataUrls). */
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  } catch(e){}
  openDB().then(function(){
    // Load any locally-saved checklist template (an admin's past edits)
    // before the very first render, so nothing ever briefly shows the
    // shipped-default checklist and then flips to the edited one.
    return loadSectionsTemplate().then(function(){
      return initCloudSync().then(function(enabled){
        return initUserRole().then(function(){
          render();
          if(enabled){
            fullReconcile().then(function(){
              if(state.view==='home' || state.view==='fleetStatus') render();
            });
          }
          if(!enabled) sbInitAuth();
        });
      });
    });
  }).catch(function(err){
    document.getElementById('app').innerHTML = '<div class="loading">'+escapeHtml(err.message||'Could not open local storage.')+'</div>';
  });
});

})();

</script>
</body>
</html>
